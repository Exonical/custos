{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-custos
  labels:
    {{- include "custos.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "custos.labels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
