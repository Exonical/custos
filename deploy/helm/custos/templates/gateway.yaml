{{- include "custos.validate" . -}}
{{- if .Values.gateway.enabled }}
{{- if and .Values.web.enabled .Values.gateway.web.hostnames }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "custos.fullname" . }}-web
  labels:
    {{- include "custos.labels" (dict "root" . "component" "web") | nindent 4 }}
  {{- with .Values.gateway.web.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.gateway.web.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "custos.webService" . }}
          port: {{ .Values.web.service.port }}
{{- end }}
{{- if .Values.gateway.api.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "custos.fullname" . }}-api
  labels:
    {{- include "custos.labels" (dict "root" . "component" "serve") | nindent 4 }}
  {{- with .Values.gateway.api.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  {{- with .Values.gateway.api.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "custos.apiService" . }}
          port: {{ .Values.api.service.port }}
{{- if .Values.gateway.api.backendTLS.enabled }}
---
apiVersion: {{ .Values.gateway.api.backendTLS.apiVersion }}
kind: BackendTLSPolicy
metadata:
  name: {{ include "custos.fullname" . }}-api
  labels:
    {{- include "custos.labels" (dict "root" . "component" "serve") | nindent 4 }}
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: {{ include "custos.apiService" . }}
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: {{ .Values.gateway.api.backendTLS.caConfigMap }}
    hostname: {{ default (include "custos.apiHost" .) .Values.gateway.api.backendTLS.hostname }}
{{- end }}
{{- end }}
{{- end }}
