apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "custos.fullname" . }}-worker
  labels:
    {{- include "custos.labels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "custos.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "custos.labels" (dict "root" . "component" "worker") | nindent 8 }}
        {{- with .Values.worker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "custos.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "custos.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      {{- include "custos.imagePullSecrets" . | nindent 6 }}
      initContainers:
        {{- if .Values.validator.enabled }}
        {{- include "custos.validatorSidecar" . | nindent 8 }}
        {{- end }}
        {{- include "custos.migrateWait" . | nindent 8 }}
      containers:
        - name: custos
          image: {{ include "custos.image" (dict "image" .Values.image "root" .) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/custos/config.yaml", "worker"]
          ports:
            - name: metrics
              containerPort: 9090
          env:
            {{- include "custos.env" (dict "root" .) | nindent 12 }}
            {{- with .Values.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # The metrics listener (plain HTTP, tls mode upstream) also serves
          # /health/ready for the worker, which has no API listener.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: metrics
              scheme: HTTP
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 15
          securityContext:
            {{- include "custos.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            {{- include "custos.volumeMounts" (dict "root" . "tls" false) | nindent 12 }}
      {{- include "custos.scheduling" .Values.worker | nindent 6 }}
      {{- include "custos.topologySpread" (dict "root" . "component" "worker" "spec" .Values.worker) | nindent 6 }}
      volumes:
        {{- include "custos.volumes" (dict "root" . "db" "app" "tls" false) | nindent 8 }}
