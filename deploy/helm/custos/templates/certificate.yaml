{{- if .Values.api.tls.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "custos.fullname" . }}-api
  labels:
    {{- include "custos.labels" (dict "root" . "component" "serve") | nindent 4 }}
spec:
  secretName: {{ include "custos.tlsSecretName" . }}
  duration: {{ .Values.api.tls.certManager.duration }}
  renewBefore: {{ .Values.api.tls.certManager.renewBefore }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
  dnsNames:
    - {{ include "custos.apiService" . }}
    - {{ include "custos.apiService" . }}.{{ .Release.Namespace }}
    - {{ include "custos.apiHost" . }}
    - {{ include "custos.apiHost" . }}.cluster.local
    {{- range .Values.api.tls.certManager.dnsNames }}
    - {{ . }}
    {{- end }}
  issuerRef:
    name: {{ .Values.api.tls.certManager.issuerRef.name }}
    kind: {{ .Values.api.tls.certManager.issuerRef.kind }}
    group: {{ .Values.api.tls.certManager.issuerRef.group }}
{{- end }}
