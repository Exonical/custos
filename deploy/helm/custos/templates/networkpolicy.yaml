{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-custos
  labels:
    {{- include "custos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "custos.labels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 8443
          protocol: TCP
      {{- if .Values.networkPolicy.ingressFromNamespaces }}
      from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: {{ toYaml .Values.networkPolicy.ingressFromNamespaces | nindent 16 }}
      {{- end }}
    - ports:
        - port: 9090
          protocol: TCP
  egress:
    # Postgres and OIDC egress are deployment-specific; configure CIDRs in
    # values. DNS is always allowed.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if .Values.networkPolicy.egress.postgresCIDR }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.egress.postgresCIDR }}
      ports:
        - port: 5432
          protocol: TCP
    {{- end }}
    {{- if .Values.networkPolicy.egress.oidcCIDR }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.egress.oidcCIDR }}
      ports:
        - port: 443
          protocol: TCP
    {{- end }}
{{- end }}
