{{- if .Values.networkPolicy.enabled }}
{{- $restrict := .Values.networkPolicy.egress.restrict }}
{{- /* serve: API (8443) and metrics (9090) */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "custos.fullname" . }}-serve
  labels:
    {{- include "custos.labels" (dict "root" . "component" "serve") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "custos.selectorLabels" (dict "root" . "component" "serve") | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $restrict }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: 8443
          protocol: TCP
      {{- if .Values.networkPolicy.apiFrom }}
      from:
        {{- if .Values.web.enabled }}
        - podSelector:
            matchLabels:
              {{- include "custos.selectorLabels" (dict "root" . "component" "web") | nindent 14 }}
        {{- end }}
        {{- toYaml .Values.networkPolicy.apiFrom | nindent 8 }}
      {{- end }}
    - ports:
        - port: 9090
          protocol: TCP
      {{- with .Values.networkPolicy.metricsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $restrict }}
  egress:
    {{- include "custos.egressRules" . | nindent 4 }}
  {{- end }}
---
{{- /* worker: metrics only (the validator on 8481 is never opened) */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "custos.fullname" . }}-worker
  labels:
    {{- include "custos.labels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "custos.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $restrict }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: 9090
          protocol: TCP
      {{- with .Values.networkPolicy.metricsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $restrict }}
  egress:
    {{- include "custos.egressRules" . | nindent 4 }}
  {{- end }}
{{- if .Values.web.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "custos.fullname" . }}-web
  labels:
    {{- include "custos.labels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "custos.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $restrict }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: 3000
          protocol: TCP
      {{- with .Values.networkPolicy.webFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $restrict }}
  egress:
    {{- include "custos.egressRules" . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
