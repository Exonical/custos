suite: file secrets validation
templates:
  - configmap.yaml
release:
  name: custos
  namespace: prod
values:
  - ../ci/external-minimal-values.yaml
tests:
  - it: duplicate mount names fail the render
    template: configmap.yaml
    set:
      fileSecrets:
        - secretName: a
          mountName: same
        - secretName: b
          mountName: same
    asserts:
      - failedTemplate:
          errorPattern: "duplicate mountName"

  - it: a mount name defaulting to a duplicated secret name fails too
    template: configmap.yaml
    set:
      fileSecrets:
        - secretName: a
        - secretName: a
    asserts:
      - failedTemplate:
          errorPattern: "duplicate mountName"

  - it: mount names must be DNS labels
    template: configmap.yaml
    set:
      fileSecrets:
        - secretName: a
          mountName: ../etc
    asserts:
      - failedTemplate:
          errorPattern: "must be a DNS label"

  - it: secretName is required
    template: configmap.yaml
    set:
      fileSecrets:
        - mountName: x
    asserts:
      - failedTemplate:
          errorPattern: "secretName"
