suite: file secrets
templates:
  - configmap.yaml
  - serve-deployment.yaml
  - worker-deployment.yaml
  - migrate-job.yaml
  - web-deployment.yaml
release:
  name: custos
  namespace: prod
values:
  - ../ci/external-minimal-values.yaml
tests:
  - it: the only file root is the dedicated directory even if config sets one
    template: configmap.yaml
    set:
      config.secrets.file_roots: [/etc/custos/secrets, /run/secrets]
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "file_roots:\\n  - /etc/custos/file-secrets\\n"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "/run/secrets"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "file_roots:[^a-z]*\\n(  - [^\\n]*\\n)*  - /etc/custos/secrets"

  - it: the default configuration has the file root and no internal directory in it
    template: configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "file_roots:\\n  - /etc/custos/file-secrets\\n"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "/etc/custos/secrets"

  - it: the root always exists through an emptyDir without entries
    templates:
      - serve-deployment.yaml
      - worker-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: file-secrets
            emptyDir: {sizeLimit: 1Mi}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: file-secrets, mountPath: /etc/custos/file-secrets, readOnly: true}

  - it: entries are mounted read-only per secret in serve and worker
    templates:
      - serve-deployment.yaml
      - worker-deployment.yaml
    set:
      fileSecrets:
        - secretName: slurm-token
        - secretName: site-a-cert
          mountName: site-a
          items:
            - {key: tls.crt, path: client.crt}
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: file-secret-slurm-token
            secret: {secretName: slurm-token, defaultMode: 288}
      - contains:
          path: spec.template.spec.volumes
          content:
            name: file-secret-site-a
            secret:
              secretName: site-a-cert
              defaultMode: 288
              items:
                - {key: tls.crt, path: client.crt}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: file-secret-slurm-token, mountPath: /etc/custos/file-secrets/slurm-token, readOnly: true}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: file-secret-site-a, mountPath: /etc/custos/file-secrets/site-a, readOnly: true}
      - notContains:
          path: spec.template.spec.initContainers[1].volumeMounts
          any: true
          content: {name: file-secret-slurm-token}

  - it: migrate and web never get file secrets
    templates:
      - migrate-job.yaml
      - web-deployment.yaml
    set:
      fileSecrets:
        - secretName: slurm-token
    asserts:
      - notMatchRegexRaw:
          pattern: "file-secret"

  - it: internal credentials stay in /etc/custos/secrets
    template: serve-deployment.yaml
    set:
      fileSecrets:
        - secretName: slurm-token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: secrets, mountPath: /etc/custos/secrets, readOnly: true}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: CUSTOS_DATABASE__URL_FILE, value: /etc/custos/secrets/database-url}
