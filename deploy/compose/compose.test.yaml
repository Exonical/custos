# Throwaway PostgreSQL for the Go test suite (scripts/testdb.sh).
# Loopback-only on 127.0.0.1:5433, data lives on tmpfs, durability
# knobs off — tests only, never a runtime stack.
name: custos-testdb

services:
  postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_PASSWORD: ${CUSTOS_TEST_DB_PASSWORD:-custos-test}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
