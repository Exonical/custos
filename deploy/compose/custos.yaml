dev_mode: true

server:
  listen: ":8080"
  tls:
    mode: disabled

metrics:
  enabled: true
  listen: ":9090"
  tls:
    mode: disabled

database:
  # verify-full even in dev_mode: dev_mode only relaxes the HTTP
  # listener TLS and OIDC, never the database path (ADR-013).
  ssl_mode: verify-full
  tls:
    root_ca_file: /run/secrets/pg-server-ca

log:
  level: info
  format: json

telemetry:
  exporter: none

secrets:
  file_roots: [/etc/custos/secrets]
  openbao:
    address: "https://openbao:8200"
    ca_file: /etc/custos/secrets/openbao.crt
    namespace: custos
    timeout: 10s
    auth:
      method: approle
      approle:
        role_id: custos-local-role
        secret_id_file: /etc/custos/secrets/openbao-secret-id

validation:
  shellcheck:
    enabled: true
    endpoint: "http://127.0.0.1:8481"
    timeout: 10s
  unavailable_severity: ERROR
