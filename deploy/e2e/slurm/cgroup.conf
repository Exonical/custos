# No cgroup confinement in e2e — the node runs unprivileged (see
# slurmd service note in compose.yaml if a later Slurm build requires
# it). TaskPlugin is task/none, so this is inert; Slurm still wants a
# valid file to parse.
CgroupPlugin=disabled
ConstrainCores=no
ConstrainRAMSpace=no
ConstrainSwapSpace=no
ConstrainDevices=no
