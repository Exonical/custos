# Slurm 26.05 (Slinky images) — single node e2e cluster for the
# Custos end-to-end suite. auth/jwt is enabled as an alt type so a
# long-lived token minted for the `custos` Slurm user can drive
# slurmrestd.
ClusterName=e2e
SlurmctldHost=slurmctld
SlurmUser=slurm

AuthType=auth/slurm
AuthAltTypes=auth/jwt
AuthAltParameters=jwt_key=/etc/slurm/jwt_hs256.key
CredType=cred/slurm

MpiDefault=none
ProctrackType=proctrack/pgid
ReturnToService=2
SchedulerType=sched/backfill
SelectType=select/cons_tres
SwitchType=switch/none
TaskPlugin=task/none

SlurmctldPidFile=/run/slurmctld.pid
SlurmctldPort=6817
SlurmdPidFile=/run/slurmd.pid
SlurmdPort=6818
SlurmdSpoolDir=/var/spool/slurmd
StateSaveLocation=/var/spool/slurmctld

InactiveLimit=0
KillWait=30
MinJobAge=300
SlurmctldTimeout=120
SlurmdTimeout=300
Waittime=0

AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmdbd
AccountingStoragePort=6819
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=30
JobCompType=jobcomp/none

NodeName=c1 NodeHostname=slurmd CPUs=2 RealMemory=1024 State=UNKNOWN
PartitionName=debug Nodes=c1 Default=YES MaxTime=INFINITE State=UP
PartitionName=gpu Nodes=c1 MaxTime=INFINITE State=UP
