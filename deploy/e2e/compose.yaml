name: custos-e2e

# End-to-end stack: real Slurm 26.05 cluster (Slinky images) +
# Keycloak 26.7 + the hardened runtime stack from deploy/compose.
# Start with scripts/e2e.sh — it runs init-secrets, brings this up and
# bootstraps Slurm accounting + the platform-admin grant.
#
# Hostname wiring: nginx carries the network aliases keycloak.e2e and
# slurmrestd.e2e, so every container resolves them to the TLS
# terminator directly. On the host, keycloak.e2e must resolve to
# 127.0.0.1 (nginx publishes 8443 on loopback) — scripts/e2e.sh prints
# the /etc/hosts line. The issuer https://keycloak.e2e:8443 is then
# identical inside and outside the stack.
#
# Secret file permissions: bind mounts arrive mode 777 on this engine
# and Slurm refuses keys/configs that aren't 600/640, so each daemon's
# entrypoint is wrapped in a bash -c that installs the files from the
# read-only /etc/slurm-secrets mount into /etc/slurm with mode 600
# before exec'ing the daemon (running as root, per the Slinky images).

include:
  - ../compose/compose.yaml

services:
  # Platform OpenBao uses file storage + TLS and Keycloak workload JWT auth.
  openbao:
    volumes:
      - ../compose/openbao.hcl:/openbao/config/openbao.hcl:ro
      - ./.secrets/openbao.crt:/openbao/tls/openbao.crt:ro
      - ./.secrets/openbao.key:/openbao/tls/openbao.key:ro
      - openbaodata:/openbao/data

  openbao-init:
    volumes:
      - ./init-openbao.sh:/bootstrap/init-openbao.sh:ro
      - ./.secrets:/bootstrap
      - ./.secrets/e2e-ca.crt:/openbao/tls/ca.crt:ro
    depends_on:
      openbao:
        condition: service_healthy
      nginx:
        condition: service_started

  # Customer-managed stand-in: dev mode is intentionally limited to e2e;
  # nginx provides TLS for every Custos connection to it.
  openbao-byo:
    image: quay.io/openbao/openbao:2.6.2
    command: ["server", "-dev", "-dev-root-token-id=e2e-byo-token", "-dev-listen-address=0.0.0.0:8200"]
    cap_add: [IPC_LOCK]
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 3s
      timeout: 3s
      retries: 30

  # ---- Slurm 26.05 cluster (cluster name: e2e) --------------------

  mariadb:
    image: docker.io/library/mariadb:11.8
    # slurmdbd fatals on InnoDB write conflicts unless snapshot
    # isolation is off (recommended by the slurmdbd docs).
    command: ["--innodb-snapshot-isolation=OFF"]
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: slurm_acct_db
      MARIADB_USER: slurm
      MARIADB_PASSWORD_FILE: /run/secrets/slurmdb-password
    secrets:
      - slurmdb-password
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30

  slurmdbd:
    hostname: slurmdbd
    image: ghcr.io/slinkyproject/slurmdbd:26.05-ubuntu26.04
    entrypoint: ["/usr/bin/tini", "-g", "--", "/bin/bash", "-c"]
    command:
      - >-
        install -m 600 -o slurm /etc/slurm-secrets/slurm.key /etc/slurm/slurm.key &&
        install -m 600 -o slurm /etc/slurm-secrets/jwt_hs256.key /etc/slurm/jwt_hs256.key &&
        install -m 600 -o slurm /etc/slurm-secrets/slurmdbd.conf /etc/slurm/slurmdbd.conf &&
        install -d -o slurm /run/slurmdbd && exec /usr/sbin/slurmdbd -D -vvv
    volumes:
      - ./slurm/slurm.conf:/etc/slurm/slurm.conf:ro
      - ./.secrets/slurm:/etc/slurm-secrets:ro
    tmpfs:
      - /run
      - /var/log/slurm
    depends_on:
      mariadb:
        condition: service_healthy

  slurmctld:
    hostname: slurmctld
    image: ghcr.io/slinkyproject/slurmctld:26.05-ubuntu26.04
    entrypoint: ["/usr/bin/tini", "-g", "--", "/bin/bash", "-c"]
    command:
      - >-
        install -m 600 -o slurm /etc/slurm-secrets/slurm.key /etc/slurm/slurm.key &&
        install -m 600 -o slurm /etc/slurm-secrets/jwt_hs256.key /etc/slurm/jwt_hs256.key &&
        install -d -m 755 -o slurm -g slurm /var/spool/slurmctld &&
        if [ -f /var/spool/slurmctld/assoc_usage ]; then exec /usr/sbin/slurmctld -D -vvv; else exec /usr/sbin/slurmctld -D -vvv -i; fi
    volumes:
      - ./slurm/slurm.conf:/etc/slurm/slurm.conf:ro
      - ./.secrets/slurm:/etc/slurm-secrets:ro
      - slurmctld_state:/var/spool/slurmctld
    tmpfs:
      - /run
      - /var/log/slurm
    depends_on:
      slurmdbd:
        condition: service_started

  slurmd:
    hostname: slurmd
    image: ghcr.io/slinkyproject/slurmd:26.05-ubuntu26.04
    entrypoint: ["/usr/bin/tini", "-g", "--", "/bin/bash", "-c"]
    command:
      - >-
        install -m 600 -o slurm /etc/slurm-secrets/slurm.key /etc/slurm/slurm.key &&
        install -m 600 -o slurm /etc/slurm-secrets/jwt_hs256.key /etc/slurm/jwt_hs256.key &&
        exec /usr/sbin/slurmd -D -vvv
    volumes:
      - ./slurm/slurm.conf:/etc/slurm/slurm.conf:ro
      - ./slurm/cgroup.conf:/etc/slurm/cgroup.conf:ro
      - ./.secrets/slurm:/etc/slurm-secrets:ro
    tmpfs:
      - /run
      - /var/spool/slurmd
      - /var/log/slurm
    depends_on:
      slurmctld:
        condition: service_started

  slurmrestd:
    image: ghcr.io/slinkyproject/slurmrestd:26.05-ubuntu26.04
    environment:
      # Required for the auth/jwt plugin to load inside slurmrestd
      # (REST quickstart: "export SLURM_JWT=daemon").
      SLURM_JWT: daemon
    entrypoint: ["/usr/bin/tini", "-g", "--", "/bin/bash", "-c"]
    command:
      - >-
        { id slurmrestd >/dev/null 2>&1 || useradd -r -u 1500 -m slurmrestd; } &&
        install -m 600 -o slurmrestd /etc/slurm-secrets/slurm.key /etc/slurm/slurm.key &&
        install -m 600 -o slurmrestd /etc/slurm-secrets/jwt_hs256.key /etc/slurm/jwt_hs256.key &&
        exec runuser -u slurmrestd -- /usr/sbin/slurmrestd -vvv -a rest_auth/jwt
        -s openapi/slurmctld,openapi/slurmdbd 0.0.0.0:6820
    volumes:
      - ./slurm/slurm.conf:/etc/slurm/slurm.conf:ro
      - ./.secrets/slurm:/etc/slurm-secrets:ro
    tmpfs:
      - /run
      - /var/log/slurm
    depends_on:
      slurmctld:
        condition: service_started

  # ---- Keycloak 26.7 reference IdP (test realm) --------------------

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: start-dev --import-realm
    environment:
      KC_HOSTNAME: "https://keycloak.e2e:8443"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Test-only bootstrap admin (console access only; tests never
      # use it). Keycloak has no *_FILE variant for this variable.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: e2e-admin-password
    volumes:
      - ./.secrets/realm-custos.json:/opt/keycloak/data/import/realm-custos.json:ro
    healthcheck:
      # Management interface (health endpoints) is port 9000 in KC 26.
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200' <&3"
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 90s

  # ---- TLS terminator ----------------------------------------------

  nginx:
    image: docker.io/library/nginx:1.29-alpine
    # Render the DNS resolver from /etc/resolv.conf (the embedded DNS IP
    # differs per engine/subnet: aardvark-dns on podman, 127.0.0.11 on
    # docker) so upstream names re-resolve per request — see the comment
    # in nginx.conf.template for why variables are used in proxy_pass.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        resolver=$$(awk '/^nameserver/{print $$2; exit}' /etc/resolv.conf) &&
        sed "s/RESOLVER_PLACEHOLDER/$$resolver/g"
        /etc/nginx/templates/nginx.conf.template > /etc/nginx/conf.d/e2e.conf &&
        exec nginx -g 'daemon off;'
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./.secrets/slurmrestd.crt:/etc/nginx/tls/slurmrestd.crt:ro
      - ./.secrets/slurmrestd.key:/etc/nginx/tls/slurmrestd.key:ro
      - ./.secrets/keycloak.crt:/etc/nginx/tls/keycloak.crt:ro
      - ./.secrets/keycloak.key:/etc/nginx/tls/keycloak.key:ro
      - ./.secrets/openbao-byo.crt:/etc/nginx/tls/openbao-byo.crt:ro
      - ./.secrets/openbao-byo.key:/etc/nginx/tls/openbao-byo.key:ro
      - ./.secrets/api.crt:/etc/nginx/tls/web.crt:ro
      - ./.secrets/api.key:/etc/nginx/tls/web.key:ro
    networks:
      default:
        aliases:
          - keycloak.e2e
          - slurmrestd.e2e
          - openbao-byo.e2e
    ports:
      # Host-side Go tests reach the same issuer and Slurm REST endpoint.
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:6820:6820"
      - "127.0.0.1:3000:3000"
    depends_on:
      keycloak:
        condition: service_healthy
      slurmrestd:
        condition: service_started
      openbao-byo:
        condition: service_healthy

  # ---- Custos runtime (config overridden for e2e) ------------------

  custos:
    volumes:
      - ./custos.yaml:/etc/custos/config.yaml:ro
      - ./.secrets:/etc/custos/secrets:ro
    environment:
      CUSTOS_AUTH__OIDC__CLIENT_SECRET_FILE: /etc/custos/secrets/keycloak-client-secret
      CUSTOS_SECRETS__OPENBAO__AUTH__JWT__OIDC_CLIENT_CREDENTIALS__CLIENT_SECRET_FILE: /etc/custos/secrets/openbao-client-secret
    depends_on:
      migrate:
        condition: service_completed_successfully
      nginx:
        condition: service_started
    networks:
      default:
        aliases:
          - custos.e2e

  worker:
    volumes:
      - ./custos.yaml:/etc/custos/config.yaml:ro
      - ./.secrets:/etc/custos/secrets:ro
    environment:
      CUSTOS_AUTH__OIDC__CLIENT_SECRET_FILE: /etc/custos/secrets/keycloak-client-secret
      CUSTOS_SECRETS__OPENBAO__AUTH__JWT__OIDC_CLIENT_CREDENTIALS__CLIENT_SECRET_FILE: /etc/custos/secrets/openbao-client-secret
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      target: runner
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        export CUSTOS_WEB_AUTH_SECRETS="$$(cat /run/secrets/custos-e2e-web-auth-secrets)" &&
        exec node server.js
    environment:
      NODE_ENV: production
      CUSTOS_WEB_ISSUER: https://keycloak.e2e:8443/realms/custos
      CUSTOS_WEB_CLIENT_ID: custos-web
      CUSTOS_WEB_CLIENT_SECRET_FILE: /run/secrets/custos-e2e-web-client-secret
      CUSTOS_WEB_PUBLIC_ORIGIN: https://127.0.0.1:3000
      CUSTOS_API_URL: https://custos.e2e:8080
      CUSTOS_WEB_TRUSTED_PROXY_HOPS: "1"
      CUSTOS_API_CA_FILE: /run/secrets/e2e-ca
      CUSTOS_WEB_CA_FILE: /run/secrets/e2e-ca
      CUSTOS_WEB_DEV: "0"
      CUSTOS_WEB_INSECURE_COOKIES: "0"
    secrets:
      - custos-e2e-web-client-secret
      - custos-e2e-web-auth-secrets
      - e2e-ca
    expose:
      - "3000"
    ports: !reset []
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    depends_on:
      custos:
        condition: service_started
      nginx:
        condition: service_started

secrets:
  slurmdb-password:
    file: ./.secrets/slurmdb-password
  custos-e2e-web-client-secret:
    file: ./.secrets/custos-web-client-secret
  custos-e2e-web-auth-secrets:
    file: ./.secrets/custos-web-auth-secrets
  e2e-ca:
    file: ./.secrets/e2e-ca.crt

volumes:
  slurmctld_state:
