# E2E Custos configuration — production posture (dev_mode: false):
# TLS on the API listener, real OIDC verification against Keycloak via
# nginx (private CA), SCRAM + verify-full on the database.

dev_mode: false

server:
  listen: ":8080"
  tls:
    mode: required
    cert_file: /etc/custos/secrets/api.crt
    key_file: /etc/custos/secrets/api.key

metrics:
  enabled: false
  listen: ":9090"

database:
  ssl_mode: verify-full
  tls:
    root_ca_file: /run/secrets/pg-server-ca

log:
  level: info
  format: json

telemetry:
  exporter: none

auth:
  oidc:
    issuer: "https://keycloak.e2e:8443/realms/custos"
    client_id: "custos-e2e"
    ca_file: /etc/custos/secrets/e2e-ca.crt
    audiences: ["custos"]
    required_scopes: []
    clock_skew: 60s

secrets:
  file_roots: [/etc/custos/secrets]

slurm:
  dial_policy:
    # slurmrestd.e2e resolves to the nginx container on the private
    # compose network; allow_private permits RFC1918 endpoints without
    # enabling loopback or plaintext.
    allow_private: true

validation:
  shellcheck:
    enabled: true
    endpoint: "http://127.0.0.1:8481"
    timeout: 10s
  unavailable_severity: ERROR

worker:
  # Tight cadence so cluster.sync reaches "active" (2 consecutive
  # successes) inside the test polling window.
  cluster_sync_interval: 10s
