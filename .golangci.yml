version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosec
    - revive
    - forbidigo
    - depguard
  settings:
    forbidigo:
      forbid:
        - pattern: '^fmt\.Print.*$'
          msg: 'use slog or write to an injected io.Writer'
        - pattern: '^log\.Print.*$'
          msg: 'use slog'
        - pattern: '^log\.Fatal.*$'
          msg: 'return an error; exit codes are handled in cmd/custos'
        - pattern: '^panic\('
          msg: 'return an error instead of panicking'
      exclude-godoc-examples: true
    depguard:
      rules:
        domain-purity:
          list-mode: lax
          files:
            - "**/internal/{authn,authz,tenants,users,projects,clusters,policy,workflows,executions,jobs,scripts,validation,admission,submission,accounting}/**"
          deny:
            - pkg: "net/http"
              desc: "HTTP belongs in internal/api or internal/platform/httpx"
            - pkg: "github.com/jackc/pgx"
              desc: "DB access belongs in postgres adapters"
            - pkg: "github.com/SlinkyProject"
              desc: "Slurm access belongs in internal/slurm/slinky"
            - pkg: "github.com/openbao"
              desc: "secrets access belongs in internal/secrets/openbao"
  exclusions:
    rules:
      - path: '_test\.go'
        linters:
          - forbidigo
          - gosec
      - path: 'cmd/custos/version\.go'
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
    - goimports
