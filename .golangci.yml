version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosec
    - revive
    - forbidigo
    - depguard
  settings:
    forbidigo:
      forbid:
        - pattern: '^fmt\.Print.*$'
          msg: 'use slog or write to an injected io.Writer'
        - pattern: '^log\.Print.*$'
          msg: 'use slog'
        - pattern: '^log\.Fatal.*$'
          msg: 'return an error; exit codes are handled in cmd/custos'
        - pattern: '^panic\('
          msg: 'return an error instead of panicking'
      exclude-godoc-examples: true
    depguard:
      rules:
        domain-purity:
          list-mode: lax
          # authn is excluded: the bearer middleware and JWKS client
          # legitimately use net/http. */postgres/ adapters are excluded
          # here (they exist to hold the pgx boundary) and get their own
          # rule below.
          files:
            - "**/internal/{authz,tenants,users,projects,clusters,policy,workflows,executions,jobs,scripts,validation,admission,submission,accounting}/**"
            - "!**/internal/*/postgres/**"
          deny:
            - pkg: "github.com/jackc/pgx"
              desc: "DB access belongs in postgres adapters"
            - pkg: "github.com/SlinkyProject"
              desc: "Slurm access belongs in internal/slurm/slinky"
            - pkg: "github.com/openbao"
              desc: "secrets access belongs in internal/secrets/openbao"
        domain-http:
          list-mode: lax
          # tenants is excluded (not listed): tenants.Require is an HTTP
          # middleware; projects.Require is too, so its file is excluded.
          files:
            - "**/internal/{authz,users,projects,clusters,policy,workflows,executions,jobs,scripts,validation,admission,submission,accounting}/**"
            - "!**/internal/*/postgres/**"
            - "!**/internal/projects/middleware.go"
            # shellcheck is the external-tool adapter: its HTTP client
            # targets the loopback sidecar only (enforced in code).
            - "!**/internal/validation/shellcheck/**"
          deny:
            - pkg: "net/http"
              desc: "HTTP belongs in internal/api or internal/platform/httpx"
        adapter-purity:
          list-mode: lax
          files:
            - "**/internal/*/postgres/**"
          deny:
            - pkg: "net/http"
              desc: "adapters must not touch HTTP"
            - pkg: "github.com/SlinkyProject"
              desc: "Slurm access belongs in internal/slurm/slinky"
            - pkg: "github.com/openbao"
              desc: "secrets access belongs in internal/secrets/openbao"
        slinky-boundary:
          list-mode: lax
          files:
            - "**/internal/**"
            - "!**/internal/slurm/slinky/**"
          deny:
            - pkg: "github.com/SlinkyProject"
              desc: "only internal/slurm/slinky may import the Slinky client"
        mvdan-boundary:
          list-mode: lax
          files:
            - "**/internal/**"
            - "!**/internal/validation/shsyntax/**"
            - "!**/internal/validation/sbatchscan/**"
          deny:
            - pkg: "mvdan.cc/sh"
              desc: "shell parsing belongs in internal/validation/{shsyntax,sbatchscan}"
        no-script-bytes:
          list-mode: lax
          # ExecutionSpec carries PayloadRef only; admission/submission
          # must never see script bodies (docs/script-validation.md).
          files:
            - "**/internal/{admission,submission}/**"
          deny:
            - pkg: "github.com/Exonical/custos/internal/scripts"
              desc: "admission/submission handle PayloadRef, never script bytes"
  exclusions:
    rules:
      - path: '_test\.go'
        linters:
          - forbidigo
          - gosec
      - path: 'cmd/custos/version\.go'
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
    - goimports
