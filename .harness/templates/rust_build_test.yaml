template:
  name: Rust Build and Test
  identifier: rust_build_test
  versionLabel: "1"
  type: Stage
  description: Format, clippy, nextest, cargo-deny, cargo-audit and release build for a Cargo project
  spec:
    type: CI
    when:
      pipelineStatus: Success
      condition: <+input>
    variables:
      - name: rust_dir
        type: String
        value: <+input>.default(.)
      - name: rust_image
        type: String
        value: <+input>.default(rust:1.98.1-bookworm)
      - name: cargo_features
        type: String
        value: <+input>.default(--all-features)
    spec:
      cloneCodebase: true
      platform:
        os: Linux
        arch: Amd64
      runtime:
        type: Cloud
        spec: {}
      caching:
        enabled: true
        paths:
          - /harness/.cache/cargo-home/registry
          - /harness/.cache/cargo-home/git
          - /harness/.cache/cargo-target
      execution:
        steps:
          - step:
              type: Run
              name: Format
              identifier: format
              spec:
                shell: Sh
                image: <+stage.variables.rust_image>
                envVariables:
                  RUST_DIR: <+stage.variables.rust_dir>
                  CARGO_HOME: /harness/.cache/cargo-home
                  CARGO_TARGET_DIR: /harness/.cache/cargo-target
                command: |-
                  set -eu
                  cd "$RUST_DIR"
                  rustup component add rustfmt
                  cargo fmt --all -- --check
          - step:
              type: Run
              name: Clippy
              identifier: clippy
              spec:
                shell: Sh
                image: <+stage.variables.rust_image>
                envVariables:
                  RUST_DIR: <+stage.variables.rust_dir>
                  CARGO_FEATURES: <+stage.variables.cargo_features>
                  CARGO_HOME: /harness/.cache/cargo-home
                  CARGO_TARGET_DIR: /harness/.cache/cargo-target
                command: |-
                  set -eu
                  cd "$RUST_DIR"
                  rustup component add clippy
                  cargo clippy --locked --all-targets $CARGO_FEATURES -- -D warnings
          - step:
              type: Run
              name: Test
              identifier: test
              spec:
                shell: Sh
                image: <+stage.variables.rust_image>
                envVariables:
                  RUST_DIR: <+stage.variables.rust_dir>
                  CARGO_FEATURES: <+stage.variables.cargo_features>
                  CARGO_HOME: /harness/.cache/cargo-home
                  CARGO_TARGET_DIR: /harness/.cache/cargo-target
                command: |-
                  set -eu
                  NEXTEST_VERSION=0.9.145
                  NEXTEST_SHA256=32aa82416099eb12fffae9cf1a279ad201fecbd3f74826c613e32e9006b29867
                  curl -fsSL -o /tmp/nextest.tar.gz "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
                  echo "${NEXTEST_SHA256}  /tmp/nextest.tar.gz" | sha256sum -c -
                  tar -xzf /tmp/nextest.tar.gz -C /usr/local/bin
                  printf '[profile.ci.junit]\npath = "/harness/reports/rust-junit.xml"\n' > /tmp/nextest.toml
                  mkdir -p /harness/reports
                  cd "$RUST_DIR"
                  cargo nextest run --locked --no-tests=pass --config-file /tmp/nextest.toml --profile ci $CARGO_FEATURES
                  if cargo metadata --locked --no-deps --format-version 1 | grep -Eq '"kind":\["(lib|rlib|proc-macro)"'; then
                    cargo test --locked --doc $CARGO_FEATURES
                  fi
                reports:
                  type: JUnit
                  spec:
                    paths:
                      - /harness/reports/rust-junit.xml
          - step:
              type: Run
              name: cargo-deny
              identifier: cargo_deny
              spec:
                shell: Sh
                image: <+stage.variables.rust_image>
                envVariables:
                  RUST_DIR: <+stage.variables.rust_dir>
                  CARGO_HOME: /harness/.cache/cargo-home
                  CARGO_TARGET_DIR: /harness/.cache/cargo-target
                command: |-
                  set -eu
                  DENY_VERSION=0.20.2
                  DENY_SHA256=9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
                  curl -fsSL -o /tmp/cargo-deny.tar.gz "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
                  echo "${DENY_SHA256}  /tmp/cargo-deny.tar.gz" | sha256sum -c -
                  tar -xzf /tmp/cargo-deny.tar.gz -C /tmp
                  install -m 0755 "/tmp/cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny" /usr/local/bin/cargo-deny
                  cd "$RUST_DIR"
                  if [ -f deny.toml ]; then
                    cargo deny check
                  else
                    echo "WARNING: deny.toml not found; license policy checks are skipped"
                    cargo deny check advisories bans sources
                  fi
          - step:
              type: Run
              name: cargo-audit
              identifier: cargo_audit
              spec:
                shell: Sh
                image: <+stage.variables.rust_image>
                envVariables:
                  RUST_DIR: <+stage.variables.rust_dir>
                  CARGO_HOME: /harness/.cache/cargo-home
                  CARGO_TARGET_DIR: /harness/.cache/cargo-target
                command: |-
                  set -eu
                  AUDIT_VERSION=0.22.2
                  AUDIT_SHA256=7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
                  curl -fsSL -o /tmp/cargo-audit.tgz "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${AUDIT_VERSION}/cargo-audit-x86_64-unknown-linux-musl-v${AUDIT_VERSION}.tgz"
                  echo "${AUDIT_SHA256}  /tmp/cargo-audit.tgz" | sha256sum -c -
                  tar -xzf /tmp/cargo-audit.tgz -C /tmp
                  install -m 0755 "/tmp/cargo-audit-x86_64-unknown-linux-musl-v${AUDIT_VERSION}/cargo-audit" /usr/local/bin/cargo-audit
                  cd "$RUST_DIR"
                  cargo audit
          - step:
              type: Run
              name: Build
              identifier: build
              spec:
                shell: Sh
                image: <+stage.variables.rust_image>
                envVariables:
                  RUST_DIR: <+stage.variables.rust_dir>
                  CARGO_FEATURES: <+stage.variables.cargo_features>
                  CARGO_HOME: /harness/.cache/cargo-home
                  CARGO_TARGET_DIR: /harness/.cache/cargo-target
                command: |-
                  set -eu
                  cd "$RUST_DIR"
                  cargo build --locked --release $CARGO_FEATURES
