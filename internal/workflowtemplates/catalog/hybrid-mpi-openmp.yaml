id: hybrid-mpi-openmp
order: 50
title: Hybrid MPI + OpenMP
summary: MPI ranks across two nodes, each rank running OpenMP threads.
description: |
  Requests 2 nodes with 4 ranks per node and 5 CPUs per rank, exports
  OMP_NUM_THREADS from the per-rank CPU count, and lets srun inherit the
  allocation after loading the gcc and openmpi modules.
workflow:
  apiVersion: custos.io/v1alpha1
  kind: Workflow
  metadata:
    name: hybrid-mpi-openmp
    labels:
      custos.io/template: hybrid-mpi-openmp
  spec:
    parameters:
      workdir:
        type: string
        required: true
        pattern: "^/"
      executable:
        type: string
        default: ./a.out
    tasks:
      - name: run
        launch: srun
        resources:
          nodes: 2
          tasksPerNode: 4
          cpusPerTask: 5
          walltime: "00:00:30"
        software:
          - {name: gcc, version: default}
          - {name: openmpi, version: default}
        workingDirectory: "{{ parameters.workdir }}"
        env:
          OMP_NUM_THREADS: "{{ task.resources.cpusPerTask }}"
        command: ["{{ parameters.executable }}"]
