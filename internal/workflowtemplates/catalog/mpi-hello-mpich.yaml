id: mpi-hello-mpich
order: 100
title: MPI Hello World (MPICH)
summary: Runs an MPICH hello-world program inside a per-cluster container runtime.
description: |
  Requests one node with four MPICH ranks and launches the inline shell
  script through srun. Configure a container runtime on the target cluster;
  the image runs as the job's Unix user.
tags: {}
workflow:
  apiVersion: custos.io/v1alpha1
  kind: Workflow
  metadata:
    name: mpi-hello-mpich
  spec:
    tasks:
      - name: mpi-hello-world
        env:
          PATH: /usr/lib64/mpich/bin:/usr/local/bin:/usr/bin:/bin
        image:
          uri: oras://docker.io/anderbubble/mpich-hello-world.sif
        script:
          inline: |
            #!/bin/sh
            mpi_hello_world
        resources:
          cpu: 4
          cpuAffinity: numa
          memory: 1GB
          walltime: "00:05:00"
        multinode:
          nodes: 1
          implementation: mpich
