id: multicore
order: 20
title: Single-node multi-process
summary: One batch launch with a 20-task allocation.
description: |
  Allocates one node with 20 tasks of one CPU each. The default sbatch
  launch starts the executable once, matching the original script; the
  executable is expected to spawn its own worker processes.
workflow:
  apiVersion: custos.io/v1alpha1
  kind: Workflow
  metadata:
    name: multicore
    labels:
      custos.io/template: multicore
  spec:
    parameters:
      workdir:
        type: string
        required: true
        pattern: "^/"
      executable:
        type: string
        default: ./a.out
    tasks:
      - name: run
        resources:
          nodes: 1
          tasksPerNode: 20
          cpusPerTask: 1
          walltime: "00:00:30"
        workingDirectory: "{{ parameters.workdir }}"
        command: ["{{ parameters.executable }}"]
