id: mpi-nodes
order: 40
title: MPI (by node count)
summary: Two full nodes with 20 MPI ranks each.
description: |
  Requests 2 nodes with 20 tasks per node (40 ranks). Adjust tasksPerNode
  to the cores per node on your cluster and keep tasks equal to
  nodes x tasksPerNode. Ranks are launched with srun after the gcc and
  openmpi modules are loaded.
workflow:
  apiVersion: custos.io/v1alpha1
  kind: Workflow
  metadata:
    name: mpi-nodes
    labels:
      custos.io/template: mpi-nodes
  spec:
    parameters:
      workdir:
        type: string
        required: true
        pattern: "^/"
      executable:
        type: string
        default: ./a.out
    tasks:
      - name: run
        type: mpi
        resources:
          nodes: 2
          tasksPerNode: 20
          tasks: 40
          cpusPerTask: 1
          walltime: "00:00:30"
        software:
          - {name: gcc, version: default}
          - {name: openmpi, version: default}
        workingDirectory: "{{ parameters.workdir }}"
        command: ["{{ parameters.executable }}"]
