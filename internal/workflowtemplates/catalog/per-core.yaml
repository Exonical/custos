id: per-core
order: 60
title: Per-core (shared node)
summary: One batch launch with a four-task per-core allocation.
description: |
  Requests 4 tasks with one CPU each and no node count, which suits
  partitions that schedule per core. Custos starts the executable once in
  the sbatch script, matching the original job script; the executable is
  responsible for starting its own worker processes.
workflow:
  apiVersion: custos.io/v1alpha1
  kind: Workflow
  metadata:
    name: per-core
    labels:
      custos.io/template: per-core
  spec:
    parameters:
      workdir:
        type: string
        required: true
        pattern: "^/"
      executable:
        type: string
        default: ./a.out
    tasks:
      - name: run
        resources:
          tasks: 4
          cpusPerTask: 1
          walltime: "00:00:30"
        workingDirectory: "{{ parameters.workdir }}"
        command: ["{{ parameters.executable }}"]
