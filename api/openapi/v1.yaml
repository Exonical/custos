        last_applied_at: {type: [string, "null"], format: date-time}
        bindings: {type: integer}
        drifted: {type: integer}
        unknown: {type: integer}
        errors: {type: integer}
        ops_applied: {type: integer}
        ops_failed: {type: integer}
