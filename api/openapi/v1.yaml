        "403":
          description: Not a tenant member with cluster.read.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Tenant or cluster not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/projects:
    get:
      summary: List projects (all for project.read principals; member projects otherwise)
      operationId: listProjects
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/Cursor"
