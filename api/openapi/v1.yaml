openapi: "3.1.0"
info:
  title: Custos API
  version: "0.1.0"
  description: |
    Multi-tenant Slurm gateway / HPC control plane. Conventions per
    docs/api.md: JSON, snake_case fields, RFC 3339 UTC timestamps,
    keyset pagination via opaque cursors, UUIDv7 identifiers.
servers:
  - url: /api/v1

paths:
  /openapi.json:
    get:
      summary: This OpenAPI document, as JSON
      operationId: openapiSpec
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                type: object

  /health/live:
    get:
      summary: Liveness probe
      operationId: healthLive
      tags: [health]
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /health/ready:
    get:
      summary: Readiness probe
      operationId: healthReady
      tags: [health]
      responses:
        "200":
          description: All required dependencies OK (degraded if only optional checks fail).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
        "503":
          description: A required dependency is failing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"

  /me:
    get:
      summary: The authenticated principal
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The provisioned principal with user id, platform roles, and memberships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tenants:
    get:
      summary: List tenants (platform)
      operationId: listTenants
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Tenant page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantList"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Forbidden.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    post:
      summary: Create a tenant (platform)
      operationId: createTenant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantCreate"
      responses:
        "201":
          description: Created tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Forbidden.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: Slug conflict.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}:
    get:
      summary: Get a tenant
      operationId: getTenant
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      responses:
        "200":
          description: The tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Tenant not found (or not visible to the caller).
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    patch:
      summary: Update a tenant
      operationId: updateTenant
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantUpdate"
      responses:
        "200":
          description: Updated tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Tenant not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: Version or state conflict.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    delete:
      summary: Request tenant deletion
      description: |
        Marks the tenant `deleting` and enqueues asynchronous deletion
        (platform.manage). The tenant row is retained as a tombstone;
        slugs are never reused.
      operationId: deleteTenant
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      responses:
        "202":
          description: Deletion accepted.
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Not a platform admin.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Tenant not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: Already deleting or deleted.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/members:
    get:
      summary: List tenant members
      operationId: listMembers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Membership page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipList"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Tenant not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    post:
      summary: Add a tenant member
      operationId: addMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberAdd"
      responses:
        "201":
          description: Granted membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Tenant not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "422":
          description: Unknown user or invalid roles.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/members/{user}:
    patch:
      summary: Replace a member's roles
      operationId: updateMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/UserRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Updated membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Tenant or membership not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: Last tenant-admin protection or state conflict.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "422":
          description: Invalid roles.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    delete:
      summary: Remove a tenant member
      operationId: removeMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/UserRef"
      responses:
        "204":
          description: Membership revoked.
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Tenant or membership not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: Last tenant-admin protection or state conflict.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/users:lookup:
    get:
      summary: Look up users by exact email (tenant.members.manage)
      operationId: lookupUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - name: email
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Users matching the email exactly (case-insensitive).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserLookupList"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Tenant not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/groups:
    get:
      summary: List tenant groups
      operationId: listGroups
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Group page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupList"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Tenant not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    post:
      summary: Create a group
      operationId: createGroup
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupCreate"
      responses:
        "201":
          description: Created group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Tenant not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: Name conflict or tenant state.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/groups/{group}:
    get:
      summary: Get a group
      operationId: getGroup
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/GroupRef"
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Tenant or group not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    patch:
      summary: Update a group
      operationId: updateGroup
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/GroupRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupUpdate"
      responses:
        "200":
          description: Updated group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Tenant or group not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: Version conflict or tenant state.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    delete:
      summary: Delete a group
      operationId: deleteGroup
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/GroupRef"
      responses:
        "204":
          description: Group deleted.
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Tenant or group not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: Tenant state conflict.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/groups/{group}/members:
    get:
      summary: List group members
      operationId: listGroupMembers
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/GroupRef"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Group membership page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMemberList"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Tenant or group not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    post:
      summary: Add a user to a group
      operationId: addGroupMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/GroupRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupMemberAdd"
      responses:
        "201":
          description: Member added.
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Tenant or group not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "422":
          description: User is not a tenant member.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/groups/{group}/members/{user}:
    delete:
      summary: Remove a user from a group
      operationId: removeGroupMember
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/GroupRef"
        - $ref: "#/components/parameters/UserRef"
      responses:
        "204":
          description: Member removed.
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Tenant, group, or membership not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/claim-rules:
    get:
      summary: List claim-mapping rules
      operationId: listClaimRules
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Claim rule page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimRuleList"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Tenant not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    post:
      summary: Create a claim-mapping rule
      operationId: createClaimRule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimRuleCreate"
      responses:
        "201":
          description: Created rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimRule"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Tenant not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "422":
          description: Invalid roles or unknown group.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/claim-rules/{rule}:
    get:
      summary: Get a claim-mapping rule
      operationId: getClaimRule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/RuleRef"
      responses:
        "200":
          description: The rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimRule"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Tenant or rule not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    patch:
      summary: Update a claim-mapping rule
      operationId: updateClaimRule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/RuleRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimRuleUpdate"
      responses:
        "200":
          description: Updated rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimRule"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Tenant or rule not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: Version conflict or tenant state.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "422":
          description: Invalid roles or unknown group.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    delete:
      summary: Delete a claim-mapping rule
      operationId: deleteClaimRule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/RuleRef"
      responses:
        "204":
          description: Rule deleted.
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Tenant or rule not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /platform/role-bindings:
    get:
      summary: List platform role bindings
      operationId: listRoleBindings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Platform role bindings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleBindingList"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires platform.manage or platform.audit.read.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /platform/role-bindings/{user}/{role}:
    put:
      summary: Grant a platform role
      operationId: grantRoleBinding
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserRef"
        - $ref: "#/components/parameters/RoleRef"
      responses:
        "204":
          description: Role granted (idempotent).
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires platform.manage.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: User not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "422":
          description: Invalid role.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    delete:
      summary: Revoke a platform role
      operationId: revokeRoleBinding
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserRef"
        - $ref: "#/components/parameters/RoleRef"
      responses:
        "204":
          description: Role revoked.
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires platform.manage.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Binding not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: Last platform-admin protection.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
            message:
              type: string
            request_id:
              type: string
            details:
              type: array
              items:
                type: object
                required: [field, reason]
                properties:
                  field:
                    type: string
                  reason:
                    type: string

    ListEnvelope:
      type: object
      description: |
        Generic list envelope template. Concrete list responses use
        `{items: [...], next_cursor: string|null}`; `total` may be added
        only where the count is cheap (never for jobs/usage).
      required: [items]
      properties:
        items:
          type: array
          items: {}
        next_cursor:
          type: string
          nullable: true
          description: Opaque base64url keyset cursor; strictly validated, re-authorized per page.

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    CheckResult:
      type: object
      required: [name, status, latency_ms]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [ok, fail]
        latency_ms:
          type: integer

    Principal:
      type: object
      required: [issuer, subject, kind]
      properties:
        issuer:
          type: string
        subject:
          type: string
        kind:
          type: string
          enum: [user, service]
        email:
          type: string
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string

    MembershipRef:
      type: object
      required: [tenant_id, slug, name, roles]
      properties:
        tenant_id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            type: string

    Me:
      type: object
      required: [principal, user_id, platform_roles, memberships]
      properties:
        principal:
          $ref: "#/components/schemas/Principal"
        user_id:
          type: string
          format: uuid
        platform_roles:
          type: array
          items:
            type: string
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/MembershipRef"

    Tenant:
      type: object
      required: [id, slug, name, state, settings, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        state:
          type: string
          enum: [provisioning, active, suspended, deleting, deleted]
        settings:
          type: object
        openbao_namespace:
          type: string
        version:
          type: integer
        created_at:
