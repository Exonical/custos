      description: >
        Returns the proposed resources/placement plus the rewritten
        script (directive lines replaced by "# [custos] imported:").
        403 IMPORT_DISABLED when the effective policy has
        allowLegacySbatchImport=false.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportSbatchRequest"
      responses:
        "200":
          description: Import proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSbatchResponse"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires workflow.create or import disabled.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "429":
          description: Per-principal validation rate limit exceeded.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/scripts:
    post:
      summary: Store a script for later reference (workflow.create; rate-limited)
      operationId: uploadScript
      description: >
        Stores the script bytes and returns its sha256 digest, which
        workflow tasks reference as `script.ref`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptUploadRequest"
      responses:
        "200":
          description: Stored digest and size.
          content:
            application/json:
              schema:
                type: object
                properties:
                  digest: {type: string}
                  size: {type: integer}
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires workflow.create.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "429":
          description: Per-principal validation rate limit exceeded.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /schemas/workflow/v1alpha1:
    get:
      summary: Workflow document JSON Schema (unauthenticated)
      operationId: getWorkflowSchema
      security: []
      responses:
        "200":
          description: The custos.io/v1alpha1 JSON Schema.
          content:
            application/schema+json:
              schema: {type: object}
        "304":
          description: Cached schema unchanged.

  /tenants/{tenant}/workflows:
    post:
      summary: Create a workflow (workflow.create on the project)
      operationId: createWorkflow
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, name]
              properties:
                project: {type: string, format: uuid}
                name: {type: string}
                description: {type: string}
      responses:
        "201":
          description: Created workflow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires workflow.create.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    get:
      summary: List workflows (optional ?project=uuid filter)
      operationId: listWorkflows
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - name: project
          in: query
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Workflows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflows:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workflow"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/workflows/{workflow}:
    get:
      summary: Get a workflow
      operationId: getWorkflow
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
      responses:
        "200":
          description: The workflow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "404":
          description: Unknown workflow.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    patch:
      summary: Edit workflow metadata (optimistic version)
      operationId: patchWorkflow
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                description: {type: string}
                version: {type: integer, format: int64}
      responses:
        "200":
          description: Updated workflow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "409":
          description: Stale version.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    delete:
      summary: Archive a workflow
      operationId: archiveWorkflow
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
      responses:
        "204":
          description: Archived.

  /tenants/{tenant}/workflows/{workflow}/versions:
    post:
      summary: Create a draft version from a YAML/JSON document
      operationId: createWorkflowVersion
      description: >
        Body is the workflow document (application/yaml or
        application/json, 4 MiB max). Runs validation steps 1-4; a
        draft is stored with number = max+1, canonical spec and
        sha256 hash. 422 SPEC_INVALID carries path-addressed details.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
      requestBody:
        required: true
        content:
          application/yaml:
            schema: {type: string}
          application/json:
            schema: {type: object}
      responses:
        "201":
          description: Created draft version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowVersion"
        "422":
          description: Spec validation failed (details[] list every error).
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    get:
      summary: List versions (newest first)
      operationId: listWorkflowVersions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
      responses:
        "200":
          description: Versions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkflowVersion"

  /tenants/{tenant}/workflows/{workflow}/versions/validate:
    post:
      summary: Run the full validation pipeline (steps 1-8) without persisting
      operationId: validateWorkflowVersionBody
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
      requestBody:
        required: true
        content:
          application/yaml:
            schema: {type: string}
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: Validation result; errors[] is empty when valid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: {type: boolean}
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        path: {type: string}
                        code: {type: string}
                        message: {type: string}

  /tenants/{tenant}/workflows/{workflow}/versions/{version}:
    get:
      summary: "Get a version (Accept: application/yaml returns YAML)"
      operationId: getWorkflowVersion
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/VersionId"
      responses:
        "200":
          description: The version with its canonical spec.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowVersion"
            application/yaml:
              schema: {type: string}
    put:
      summary: Replace a draft version's spec (409 VERSION_IMMUTABLE otherwise)
      operationId: updateWorkflowVersion
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/VersionId"
        - name: X-Expected-Version
          in: header
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/yaml:
            schema: {type: string}
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: Updated draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowVersion"
        "409":
          description: Version immutable or stale expected version.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/workflows/{workflow}/versions/{version}/layout:
    put:
      summary: Store editor layout (draft and published versions)
      operationId: updateWorkflowLayout
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/VersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "204":
          description: Stored.

  /tenants/{tenant}/workflows/{workflow}/versions/{version}/publish:
    post:
      summary: Publish a draft (workflow.publish; full validation + script gate)
      operationId: publishWorkflowVersion
      description: >
        Runs steps 1-8 plus a current valid ScriptValidation for every
        script-bearing task (missing/stale ones run the pipeline
        synchronously). On success the version becomes immutable and
        the workflow's latest_published_version_id is set atomically.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/VersionId"
      responses:
        "200":
          description: Published version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowVersion"
        "422":
          description: Validation or per-task script diagnostics failed.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: Version is not a draft.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/workflows/{workflow}/versions/{version}/deprecate:
    post:
      summary: Deprecate a published version (workflow.publish)
      operationId: deprecateWorkflowVersion
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/VersionId"
      responses:
        "204":
          description: Deprecated.
        "409":
          description: Version is not published.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/workflows/{workflow}/versions/{version}/validations:
    get:
      summary: ScriptValidations recorded against this version
      operationId: listWorkflowVersionValidations
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/VersionId"
      responses:
        "200":
          description: Validations, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  validations:
                    type: array
                    items:
                      type: object

  /tenants/{tenant}/workflows/{workflow}/versions/{version}/tasks/{task}/validate:
    post:
      summary: Run the validation pipeline on one task's script
      operationId: validateWorkflowTask
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/VersionId"
        - $ref: "#/components/parameters/TaskName"
      responses:
        "200":
          description: Validation result persisted for (version, task).
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: {type: boolean}
                  validationId: {type: string, format: uuid}
                  diagnostics:
                    type: array
                    items:
                      $ref: "#/components/schemas/Diagnostic"
                  toolVersions:
                    type: object
                    additionalProperties: {type: string}

  /tenants/{tenant}/workflows/{workflow}/versions/{version}/tasks/{task}/import-sbatch:
    post:
      summary: Convert legacy #SBATCH directives for one task (proposal only)
      operationId: importWorkflowTaskSbatch
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/VersionId"
        - $ref: "#/components/parameters/TaskName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportSbatchRequest"
      responses:
        "200":
          description: Import proposal; the draft is not modified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSbatchResponse"
        "403":
          description: Import disabled by effective policy.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/workflows/{workflow}/versions/{version}/tasks/{task}/preview-submission:
    post:
      summary: Read-only submission preview for one task (workflow.read)
      operationId: previewWorkflowTaskSubmission
      description: >
        Builds the frozen ExecutionSpec, wrapper script and neutral
        JobSubmission for the task (attempt=1, caller as principal).
        Persists nothing, submits nothing.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/VersionId"
        - $ref: "#/components/parameters/TaskName"
      responses:
        "200":
          description: Submission preview.
          content:
            application/json:
              schema:
                type: object
                properties:
                  executionSpec: {type: object}
                  wrapper: {type: string}
                  jobSubmission: {type: object}
        "422":
          description: Admission denied.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/workflow-executions:
    post:
      summary: Execute a published workflow version (workflow.execute; Idempotency-Key required)
      operationId: executeWorkflow
      description: >
        Creates a PENDING WorkflowExecution pinned to the version's spec
        hash and enqueues the engine. The idempotency key scopes replay
        to (tenant, key); a reused key with a different body is a 409.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/Idempotency-Key"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowExecuteRequest"
      responses:
        "202":
          description: Execution accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecution"
        "400":
          description: Missing/invalid Idempotency-Key or malformed body.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires workflow.execute on the project.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Workflow not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: Idempotency-Key reused with a different body, no published version, or the version is not published.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    get:
      summary: List workflow executions (execution.read.self|tenant)
      operationId: listWorkflowExecutions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: workflow
          in: query
          description: Workflow uuid filter.
          schema: {type: string, format: uuid}
        - name: state
          in: query
          description: Execution state filter.
          schema: {type: string}
      responses:
        "200":
          description: Execution list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecutionList"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires execution.read.self.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/workflow-executions/{execution}:
    get:
      summary: Get a workflow execution (execution.read.self|project|tenant)
      operationId: getWorkflowExecution
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - name: execution
          in: path
          required: true
          description: Execution uuid.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The execution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecution"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires an execution.read.* permission.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Execution not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/workflow-executions/{execution}/cancel:
    post:
      summary: Cancel an execution (execution.cancel.self|any)
      operationId: cancelWorkflowExecution
      description: >
        Moves the execution to CANCELING; the engine enqueues
        job.cancel for active task jobs and cancels the rest.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - name: execution
          in: path
          required: true
          description: Execution uuid.
          schema: {type: string, format: uuid}
      responses:
        "202":
          description: Cancellation accepted.
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires an execution.cancel.* permission.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Execution not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: Execution is already terminal.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/workflow-executions/{execution}/tasks:
    get:
      summary: List task executions (execution.read.self|project|tenant)
      operationId: listTaskExecutions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - name: execution
          in: path
          required: true
          description: Execution uuid.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Task executions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskExecutionList"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Execution not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/workflow-executions/{execution}/tasks/{task}/execution-spec:
    get:
      summary: Get the task's frozen ExecutionSpec (execution.read.*)
      operationId: getTaskExecutionSpec
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - name: execution
          in: path
          required: true
          description: Execution uuid.
          schema: {type: string, format: uuid}
        - name: task
          in: path
          required: true
          description: Task execution uuid.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The frozen ExecutionSpec.
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Task execution or frozen spec not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/workflow-executions/{execution}/tasks/{task}/validation:
    get:
      summary: Get the task's recorded ScriptValidation (execution.read.*)
      operationId: getTaskExecutionValidation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - name: execution
          in: path
          required: true
          description: Execution uuid.
          schema: {type: string, format: uuid}
        - name: task
          in: path
          required: true
          description: Task execution uuid.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The recorded ScriptValidation.
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Task execution or validation not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/policies/validation:
    get:
      summary: Get the tenant validation policy (policy.read)
      operationId: getTenantValidationPolicy
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      responses:
        "200":
          description: Validation policy (defaults when unset, version 0).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationPolicyResponse"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Tenant not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    put:
      summary: Replace the tenant validation policy (policy.manage)
      operationId: setTenantValidationPolicy
      description: >
        Tenant policy may only be stricter than every assigned cluster's
        policy — a looser write is rejected 422 POLICY_NOT_STRICTER.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationPolicyRequest"
      responses:
        "200":
          description: Policy stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationPolicyResponse"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires policy.manage.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: Version conflict.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "422":
          description: Invalid policy or not stricter than a cluster policy.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /clusters/{cluster}/policies/validation:
    get:
      summary: Get the cluster validation policy (platform)
      operationId: getClusterValidationPolicy
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClusterRef"
      responses:
        "200":
          description: Validation policy (defaults when unset, version 0).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationPolicyResponse"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Cluster not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    put:
      summary: Replace the cluster validation policy (platform only)
      operationId: setClusterValidationPolicy
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClusterRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationPolicyRequest"
      responses:
        "200":
          description: Policy stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationPolicyResponse"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires policy.manage at platform scope.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Cluster not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: Version conflict.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/jobs:
    get:
      summary: List jobs tenant-wide (job.read.tenant)
      operationId: listTenantJobs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: state
          in: query
          description: Comma-separated job states filter.
          schema: {type: string}
        - name: cluster
          in: query
          description: Cluster uuid filter.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Job list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires job.read.tenant.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/projects/{project}/jobs:
    get:
      summary: List project jobs (job.read.project or own jobs)
      operationId: listJobs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/ProjectRef"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: state
          in: query
          description: Comma-separated job states filter.
          schema: {type: string}
        - name: cluster
          in: query
          description: Cluster uuid filter.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Job list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Project not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    post:
      summary: Submit a job (job.submit; Idempotency-Key required)
      operationId: submitJob
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/ProjectRef"
        - $ref: "#/components/parameters/Idempotency-Key"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobSubmit"
      responses:
        "202":
          description: Job accepted for submission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "200":
          description: Idempotent replay of a previous submission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: Missing/invalid Idempotency-Key or malformed body.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires job.submit.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Project not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: Idempotency-Key reused with a different body (IDEMPOTENCY_MISMATCH).
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "422":
          description: Script validation or admission denial.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorBody"

  /tenants/{tenant}/projects/{project}/jobs/{job}:
    get:
      summary: Get a job
      operationId: getJob
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/ProjectRef"
        - name: job
          in: path
          required: true
          description: Job uuid.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Job detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Job not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/projects/{project}/jobs/{job}/cancel:
    post:
      summary: Request job cancellation (202)
      operationId: cancelJob
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/ProjectRef"
        - name: job
          in: path
          required: true
          description: Job uuid.
          schema: {type: string, format: uuid}
      responses:
        "202":
          description: Cancellation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Job not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: Job is already terminal.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/projects/{project}/jobs/{job}/execution-spec:
    get:
      summary: Get the immutable admitted execution spec
      operationId: getJobExecutionSpec
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/ProjectRef"
        - name: job
          in: path
          required: true
          description: Job uuid.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The frozen ExecutionSpec.
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Job not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/secret-connectors:
    parameters:
      - $ref: "#/components/parameters/TenantSlug"
    get:
      operationId: listSecretConnectors
      summary: List tenant secret connectors
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Connector list, content: {application/json: {schema: {type: object}}}}
    post:
      operationId: createSecretConnector
      summary: Create a tenant secret connector
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateSecretConnector"}}}}
      responses:
        "201": {description: Connector created, content: {application/json: {schema: {$ref: "#/components/schemas/SecretConnector"}}}}
        "422": {description: Invalid or unavailable provider, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}

  /tenants/{tenant}/secret-connectors/{connector}:
    parameters:
      - $ref: "#/components/parameters/TenantSlug"
      - {name: connector, in: path, required: true, schema: {type: string}}
    get:
      operationId: getSecretConnector
      security: [{bearerAuth: []}]
      responses: {"200": {description: Connector, content: {application/json: {schema: {$ref: "#/components/schemas/SecretConnector"}}}}}
    patch:
      operationId: updateSecretConnector
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"200": {description: Connector updated, content: {application/json: {schema: {$ref: "#/components/schemas/SecretConnector"}}}}}
    delete:
      operationId: deleteSecretConnector
      security: [{bearerAuth: []}]
      responses: {"204": {description: Connector deleted}, "409": {description: Connector is in use}}

  /tenants/{tenant}/secret-connectors/{connector}/test:
    parameters:
      - $ref: "#/components/parameters/TenantSlug"
      - {name: connector, in: path, required: true, schema: {type: string}}
    post:
      operationId: testSecretConnector
      security: [{bearerAuth: []}]
      responses: {"200": {description: Connectivity result, content: {application/json: {schema: {type: object}}}}}

  /tenants/{tenant}/secret-references:
    parameters:
      - $ref: "#/components/parameters/TenantSlug"
    get:
      operationId: listSecretReferences
      security: [{bearerAuth: []}]
      responses: {"200": {description: Reference list, content: {application/json: {schema: {type: object}}}}}
    post:
      operationId: createSecretReference
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateSecretReference"}}}}
      responses: {"201": {description: Reference created, content: {application/json: {schema: {$ref: "#/components/schemas/SecretReference"}}}}, "422": {description: Invalid reference}}

  /tenants/{tenant}/secret-references/{reference}:
    parameters:
      - $ref: "#/components/parameters/TenantSlug"
      - {name: reference, in: path, required: true, schema: {type: string}}
    get:
      operationId: getSecretReference
      security: [{bearerAuth: []}]
      responses: {"200": {description: Reference, content: {application/json: {schema: {$ref: "#/components/schemas/SecretReference"}}}}}
    patch:
      operationId: updateSecretReference
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {"200": {description: Reference updated, content: {application/json: {schema: {$ref: "#/components/schemas/SecretReference"}}}}}
    delete:
      operationId: deleteSecretReference
      security: [{bearerAuth: []}]
      responses: {"204": {description: Reference deleted}}

  /tenants/{tenant}/secret-references/{reference}/test:
    parameters:
      - $ref: "#/components/parameters/TenantSlug"
      - {name: reference, in: path, required: true, schema: {type: string}}
    post:
      operationId: testSecretReference
      security: [{bearerAuth: []}]
      responses: {"200": {description: Resolution result without a value, content: {application/json: {schema: {type: object}}}}}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
            message:
              type: string
            request_id:
              type: string
            details:
              type: array
              items:
                type: object
                required: [field, reason]
                properties:
                  field:
                    type: string
                  reason:
                    type: string

    ListEnvelope:
      type: object
      description: |
        Generic list envelope template. Concrete list responses use
        `{items: [...], next_cursor: string|null}`; `total` may be added
        only where the count is cheap (never for jobs/usage).
      required: [items]
      properties:
        items:
          type: array
          items: {}
        next_cursor:
          type: string
          nullable: true
          description: Opaque base64url keyset cursor; strictly validated, re-authorized per page.

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    CheckResult:
      type: object
      required: [name, status, latency_ms]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [ok, fail]
        latency_ms:
          type: integer

    Principal:
      type: object
      required: [issuer, subject, kind]
      properties:
        issuer:
          type: string
        subject:
          type: string
        kind:
          type: string
          enum: [user, service]
        email:
          type: string
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string

    MembershipRef:
      type: object
      required: [tenant_id, slug, name, roles]
      properties:
        tenant_id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            type: string

    Me:
      type: object
      required: [principal, user_id, platform_roles, memberships]
      properties:
        principal:
          $ref: "#/components/schemas/Principal"
        user_id:
          type: string
          format: uuid
        platform_roles:
          type: array
          items:
            type: string
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/MembershipRef"
        project_memberships:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMembershipRef"

    Project:
      type: object
      required: [id, slug, name, description, state, settings, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        state:
          type: string
          enum: [active, archived]
        settings:
          type: object
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        next_cursor:
          type: string
          nullable: true

    ProjectCreate:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        settings:
          type: object

    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        settings:
          type: object
        version:
          type: integer

    ProjectMembership:
      type: object
      required: [project_id, user_id, roles, source, created_at, updated_at]
      properties:
        project_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
            enum: [project-admin, project-member, project-viewer]
        source:
          type: string
          enum: [manual, idp]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectMembershipList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMembership"
        next_cursor:
          type: string
          nullable: true

    ProjectMembershipRef:
      type: object
      required: [project_id, slug, tenant_id, roles]
      properties:
        project_id:
          type: string
          format: uuid
        slug:
          type: string
        tenant_id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string

    ProjectMemberUpsert:
      type: object
      required: [user_id, roles]
      properties:
        user_id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
            enum: [project-admin, project-member, project-viewer]

    ProjectMemberUpdate:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items:
            type: string
            enum: [project-admin, project-member, project-viewer]

    ClusterBinding:
      type: object
      required: [id, project_id, cluster_id, slurm_account, default_partition,
        allowed_partitions, default_qos, allowed_qos, enabled, version,
        created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        cluster_id:
          type: string
          format: uuid
        slurm_account:
          type: string
        default_partition:
          type: string
        allowed_partitions:
          type: array
          items:
            type: string
        default_qos:
          type: string
        allowed_qos:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ClusterBindingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClusterBinding"

    ClusterBindingUpsert:
      type: object
      required: [cluster_id, slurm_account]
      properties:
        cluster_id:
          type: string
          format: uuid
        slurm_account:
          type: string
        default_partition:
          type: string
        allowed_partitions:
          type: array
          items:
            type: string
        default_qos:
          type: string
        allowed_qos:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        version:
          type: integer

    ResourcePolicyRequest:
      type: object
      required: [policy]
      properties:
        policy:
          type: object
          description: admission.ResourcePolicy JSON shape (see docs/script-validation.md).
        version:
          type: integer

    ResourcePolicyResponse:
      type: object
      required: [policy, version]
      properties:
        policy:
          type: object
        version:
          type: integer
        effective:
          type: object
          description: Project-scope GETs also return the tenant ∩ project effective policy.

    Tenant:
      type: object
      required: [id, slug, name, state, settings, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        state:
          type: string
          enum: [provisioning, active, suspended, deleting, deleted]
        settings:
          type: object
        openbao_namespace:
          type: string
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TenantCreate:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
        name:
          type: string
          minLength: 1
        settings:
          type: object

    TenantUpdate:
      type: object
      required: [version]
      properties:
        name:
          type: string
        settings:
          type: object
        state:
          type: string
          enum: [active, suspended]
        version:
          type: integer

    TenantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tenant"
        next_cursor:
          type: string
          nullable: true

    Membership:
      type: object
      required: [tenant_id, user_id, roles, source, created_at, updated_at]
      properties:
        tenant_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
        source:
          type: string
          enum: [manual, idp]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MemberAdd:
      type: object
      required: [user_id, roles]
      properties:
        user_id:
          type: string
          format: uuid
        roles:
          type: array
          minItems: 1
          items:
            type: string
            enum: [tenant-admin, tenant-operator, workflow-author, researcher, viewer, auditor]

    MemberUpdate:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          items:
            type: string
            enum: [tenant-admin, tenant-operator, workflow-author, researcher, viewer, auditor]

    MembershipList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
        next_cursor:
          type: string
          nullable: true

    ReadyStatus:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/CheckResult"

    Group:
      type: object
      required: [id, tenant_id, name, description, source, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        source:
          type: string
          enum: [manual, idp]
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GroupCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9 ._-]{0,62}$"
        description:
          type: string

    GroupUpdate:
      type: object
      required: [version]
      properties:
        name:
          type: string
        description:
          type: string
        version:
          type: integer

    GroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Group"
        next_cursor:
          type: string
          nullable: true

    GroupMembership:
      type: object
      required: [group_id, user_id, source, created_at]
      properties:
        group_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        source:
          type: string
          enum: [manual, idp]
        created_at:
          type: string
          format: date-time

    GroupMemberAdd:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid

    GroupMemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroupMembership"
        next_cursor:
          type: string
          nullable: true

    ClaimRule:
      type: object
      required: [id, tenant_id, claim, match_value, roles, enabled, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        claim:
          type: string
        match_value:
          type: string
        roles:
          type: array
          items:
            type: string
        group_id:
          type: string
          format: uuid
          nullable: true
        enabled:
          type: boolean
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ClaimRuleCreate:
      type: object
      required: [claim, match_value, roles]
      properties:
        claim:
          type: string
          pattern: "^[a-zA-Z_][a-zA-Z0-9_.:/-]{0,127}$"
        match_value:
          type: string
          minLength: 1
          maxLength: 512
        roles:
          type: array
          minItems: 1
          items:
            type: string
            enum: [tenant-admin, tenant-operator, workflow-author, researcher, viewer, auditor]
        group_id:
          type: string
          format: uuid
        enabled:
          type: boolean

    ClaimRuleUpdate:
      type: object
      required: [version]
      properties:
        roles:
          type: array
          minItems: 1
          items:
            type: string
            enum: [tenant-admin, tenant-operator, workflow-author, researcher, viewer, auditor]
        group_id:
          type: string
          format: uuid
          nullable: true
        enabled:
          type: boolean
        version:
          type: integer

    ClaimRuleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClaimRule"
        next_cursor:
          type: string
          nullable: true

    PlatformRoleBinding:
      type: object
      required: [user_id, issuer, subject, role, created_at]
      properties:
        user_id:
          type: string
          format: uuid
        issuer:
          type: string
        subject:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [platform-admin, platform-auditor]
        created_at:
          type: string
          format: date-time

    RoleBindingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlatformRoleBinding"

    UserLookupResult:
      type: object
      required: [id, email, kind]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [user, service]

    UserLookupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserLookupResult"

    SecretUse:
      type: object
      required: [ref, use]
      additionalProperties: false
      properties:
        ref:
          type: string
          description: SecretReference name in the tenant.
        use:
          type: string
          enum: [env, wrapped_token]
        envName:
          type: string
          pattern: "^[A-Z_][A-Z0-9_]*$"
          description: Env-mode variable name; defaults to upper-snake handle.

    SecretConnector:
      type: object
      required: [id, tenant_id, name, kind, state, config, version]
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        name: {type: string}
        kind: {type: string, enum: [platform-openbao, openbao]}
        state: {type: string, enum: [active, disabled]}
        config: {type: object, additionalProperties: true}
        credential_ref: {$ref: "#/components/schemas/SecretRef"}
        version: {type: integer, format: int64}

    CreateSecretConnector:
      type: object
      required: [name, kind, config, credential]
      properties:
        name: {type: string}
        kind: {type: string, enum: [openbao]}
        config: {type: object, additionalProperties: true}
        credential:
          type: object
          additionalProperties: {type: string}
          writeOnly: true

    SecretReference:
      type: object
      required: [id, tenant_id, name, connector_id, namespace, mount, path, key, kind, allowed_uses, version]
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        owner_id: {type: [string, "null"], format: uuid}
        project_id: {type: [string, "null"], format: uuid}
        name: {type: string}
        connector_id: {type: string, format: uuid}
        namespace: {type: string}
        mount: {type: string}
        path: {type: string}
        key: {type: string}
        secret_version: {type: [integer, "null"], minimum: 1}
        kind: {type: string, enum: [ssh_key, slurm_token, api_token, generic, storage_credential]}
        allowed_uses: {type: array, items: {type: string}}
        version: {type: integer, format: int64}

    CreateSecretReference:
      type: object
      required: [name, path, key, kind]
      properties:
        name: {type: string}
        connector: {type: string, default: default}
        owner_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        mount: {type: string}
        path: {type: string}
        key: {type: string}
        secret_version: {type: integer, minimum: 1}
        kind: {type: string, enum: [ssh_key, slurm_token, api_token, generic, storage_credential]}
        allowed_uses: {type: array, items: {type: string}}

    SecretRef:
      type: object
      description: Reference to a secret value (docs/secrets.md); never the value.
      required: [provider, path]
      properties:
        provider:
          type: string
          enum: [file, openbao]
        namespace:
          type: string
          description: OpenBao namespace; required for openbao references.
        mount:
          type: string
          description: OpenBao KV v2 mount; required for openbao references.
        path:
          type: string
        key:
          type: string
          description: Field within the secret document.
        version:
          type: integer
          minimum: 1
          description: Optional pinned OpenBao KV version.

    AssignmentDefaults:
      type: object
      properties:
        default_account_prefix:
          type: string
        allowed_partitions:
          type: array
          items:
            type: string

    Cluster:
      type: object
      required: [id, name, display_name, base_url, api_version, identity_mode,
                 service_user, token_ref, visibility, state, version,
                 created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        display_name:
          type: string
        base_url:
          type: string
        api_version:
          type: string
          enum: [v0.0.45, v0.0.44]
        ca_bundle_pem:
          type: string
        identity_mode:
          type: string
          enum: [service, impersonate]
        service_user:
          type: string
        token_ref:
          $ref: "#/components/schemas/SecretRef"
        client_cert_ref:
          $ref: "#/components/schemas/SecretRef"
        visibility:
          type: string
          enum: [assigned, all_tenants]
        state:
          type: string
          enum: [active, degraded, unreachable, disabled]
        consecutive_failures:
          type: integer
        last_sync_at:
          type: string
          format: date-time
        last_error:
          type: string
        capabilities_at:
          type: string
          format: date-time
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ClusterCreate:
      type: object
      required: [name, display_name, base_url, api_version, identity_mode,
                 service_user, token_ref, visibility]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
        display_name:
          type: string
        base_url:
          type: string
          description: https URL of slurmrestd; vetted against the SSRF dial policy.
        api_version:
          type: string
          enum: [v0.0.45, v0.0.44]
        ca_bundle_pem:
          type: string
        identity_mode:
          type: string
          enum: [service, impersonate]
        service_user:
          type: string
        token_ref:
          $ref: "#/components/schemas/SecretRef"
        client_cert_ref:
          $ref: "#/components/schemas/SecretRef"
        visibility:
          type: string
          enum: [assigned, all_tenants]

    ClusterUpdate:
      type: object
      required: [version]
      properties:
        display_name:
          type: string
        base_url:
          type: string
        api_version:
          type: string
          enum: [v0.0.45, v0.0.44]
        ca_bundle_pem:
          type: string
        identity_mode:
          type: string
          enum: [service, impersonate]
        service_user:
          type: string
        token_ref:
          $ref: "#/components/schemas/SecretRef"
        client_cert_ref:
          $ref: "#/components/schemas/SecretRef"
        visibility:
          type: string
          enum: [assigned, all_tenants]
        version:
          type: integer
          description: Optimistic concurrency token.

    ClusterTestResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        latency_ms:
          type: integer
        slurm_version:
          type: string
        api_version:
          type: string
        partitions:
          type: array
          items:
            type: string
        error_code:
          type: string

    Assignment:
      type: object
      required: [cluster_id, tenant_id, source, defaults, created_at, updated_at]
      properties:
        cluster_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        source:
          type: string
          enum: [manual, auto]
        defaults:
          $ref: "#/components/schemas/AssignmentDefaults"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AssignmentPut:
      type: object
      properties:
        defaults:
          $ref: "#/components/schemas/AssignmentDefaults"

    ClusterSummary:
      type: object
      description: Tenant-facing view; contains no platform configuration
        (base_url, token_ref, ca_bundle are never returned to tenants).
      required: [id, name, display_name, state, partitions, defaults]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        display_name:
          type: string
        state:
          type: string
          enum: [active, degraded, unreachable, disabled]
        slurm_version:
          type: string
        partitions:
          type: array
          items:
            type: string
        gres_types:
          type: array
          items:
            type: string
        node_summary:
          type: object
          additionalProperties:
            type: integer
        defaults:
          $ref: "#/components/schemas/AssignmentDefaults"

    PartitionRecord:
      type: object
      required: [name, attributes, synced_at]
      properties:
        name:
          type: string
        attributes:
          type: object
          description: slurm.Partition neutral attributes.
        synced_at:
          type: string
          format: date-time

    ClusterList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Cluster"
        next_cursor:
          type: string
          nullable: true

    AssignmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Assignment"
        next_cursor:
          type: string
          nullable: true

    ClusterSummaryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClusterSummary"

    PartitionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PartitionRecord"

    Job:
      type: object
      required: [id, tenant_id, project_id, cluster_id, created_by, name,
                 state, resource_request, script_digest, script_language,
                 version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        cluster_id: {type: string, format: uuid}
        created_by: {type: string, format: uuid}
        name: {type: string}
        state:
          type: string
          enum: [SUBMITTING, QUEUED, RUNNING, COMPLETED, FAILED, CANCELED]
        state_reason: {type: string}
        slurm_job_id: {type: integer, format: int64}
        slurm_state: {type: string}
        exit_code: {type: integer}
        exit_signal: {type: integer}
        resource_request: {type: object}
        script_digest: {type: string, description: "sha256:<hex>"}
        script_language: {type: string}
        execution_spec_id: {type: string, description: "sha256:<hex> digest of the immutable ExecutionSpec"}
        validation_id: {type: string, format: uuid, description: "ScriptValidation that admitted this job"}
        submitted_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time}
        last_reconciled_at: {type: string, format: date-time}
        version: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    JobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        next_cursor:
          type: string
          nullable: true

    JobSubmit:
      type: object
      required: [cluster, resources]
      properties:
        name: {type: string, maxLength: 128}
        cluster:
          type: string
          description: Cluster name or uuid.
        partition: {type: string}
        qos: {type: string}
        resources:
          type: object
          description: Resource request (workflowspec.Resources shape).
        script:
          type: object
          required: [language, body]
          properties:
            language: {type: string, enum: [bash, sh]}
            body: {type: string}
        script_ref:
          type: string
          description: "Digest of a previously stored script: sha256:<hex>"
        env:
          type: object
          additionalProperties: {type: string}
        secrets:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SecretUse"
        working_dir: {type: string}
        args:
          type: array
          items: {type: string}
        stdout: {type: string}
        stderr: {type: string}

    ValidationPolicy:
      type: object
      description: ValidationPolicy (docs/script-validation.md).
      properties:
        blockAt: {type: string, enum: [INFO, WARNING, ERROR]}
        overrides:
          type: array
          items:
            type: object
            required: [source, code, severity]
            properties:
              source: {type: string}
              code: {type: string}
              severity: {type: string, enum: [INFO, WARNING, ERROR]}
        disabledCodes:
          type: array
          items: {type: string}
          description: Only non-CUSTOS codes (e.g. shellcheck) may be disabled.
        shellcheckShell: {type: string, enum: [bash, sh, dash, ksh]}
        allowShellTasks: {type: boolean}
        allowLegacySbatchImport: {type: boolean}
        forbiddenCommands:
          type: array
          items: {type: string}
        forbiddenCommandsSeverity: {type: string, enum: [INFO, WARNING, ERROR]}
        filteredEnvAllow:
          type: array
          items: {type: string}

    ValidationPolicyRequest:
      type: object
      required: [policy, version]
      properties:
        policy:
          $ref: "#/components/schemas/ValidationPolicy"
        version:
          type: integer
          format: int64
          description: Expected current version; 0 creates.

    ValidationPolicyResponse:
      type: object
      required: [policy, version]
      properties:
        policy:
          $ref: "#/components/schemas/ValidationPolicy"
        version:
          type: integer
          format: int64

    ScriptValidateRequest:
      type: object
      required: [language, script]
      properties:
        language: {type: string, enum: [bash, sh, python, yaml, json]}
        script: {type: string}
        resources: {type: object}
        environment:
          type: object
          additionalProperties: {type: string}
        software:
          type: array
          items: {type: object}
        cluster: {type: string, description: "Cluster name or uuid"}

    ScriptValidateResponse:
      type: object
      required: [valid, digest, blockAt, diagnostics, toolVersions, effectivePolicy]
      properties:
        valid: {type: boolean}
        digest: {type: string, description: "sha256:<hex>"}
        blockAt: {type: string}
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/Diagnostic"
        toolVersions:
          type: object
          additionalProperties: {type: string}
        effectivePolicy:
          type: object
          properties:
            blockAt: {type: string}
            allowShellTasks: {type: boolean}
            allowLegacySbatchImport: {type: boolean}
            filteredEnvAllowed:
              type: array
              items: {type: string}

    Workflow:
      type: object
      required: [id, tenantId, projectId, name, state, version]
      properties:
        id: {type: string, format: uuid}
        tenantId: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        state: {type: string, enum: [active, archived]}
        latestPublishedVersionId: {type: string, format: uuid, nullable: true}
        version: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}

    WorkflowVersion:
      type: object
      required: [id, workflowId, number, state, schemaVersion, specHash, version]
      properties:
        id: {type: string, format: uuid}
        workflowId: {type: string, format: uuid}
        number: {type: integer}
        state: {type: string, enum: [draft, published, deprecated]}
        schemaVersion: {type: string}
        specHash: {type: string}
        layout: {type: object}
        spec: {type: object}
        version: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        publishedAt: {type: string, format: date-time, nullable: true}

    WorkflowExecuteRequest:
      type: object
      required: [workflow]
      properties:
        workflow:
          type: string
          format: uuid
          description: Workflow uuid.
        version:
          type: string
          format: uuid
          description: Version uuid; defaults to the latest published version.
        parameters:
          type: object
          additionalProperties: true
          description: Runtime parameter values validated against spec.parameters.

    WorkflowExecution:
      type: object
      required: [id, tenantId, projectId, workflowId, workflowVersionId, state, requestedBy, version]
      properties:
        id: {type: string, format: uuid}
        tenantId: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        workflowId: {type: string, format: uuid}
        workflowVersionId: {type: string, format: uuid}
        specHash: {type: string}
        parameters: {type: object}
        strategy: {type: string, enum: [auto, engine, native]}
        state:
          type: string
          enum: [PENDING, VALIDATING, QUEUED, RUNNING, SUCCEEDED, FAILED, PARTIAL_FAILURE, CANCELING, CANCELED]
        stateReason: {type: string}
        requestedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time, nullable: true}
        endedAt: {type: string, format: date-time, nullable: true}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, format: int64}

    WorkflowExecutionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowExecution"
        next_cursor: {type: string, nullable: true}

    TaskExecution:
      type: object
      required: [id, executionId, taskName, index, count, attempt, state, version]
      properties:
        id: {type: string, format: uuid}
        executionId: {type: string, format: uuid}
        taskName: {type: string}
        index: {type: integer}
        count: {type: integer}
        attempt: {type: integer}
        state:
          type: string
          enum: [PENDING, BLOCKED, READY, ADMITTING, SUBMITTING, QUEUED, RUNNING, COMPLETED, FAILED, SKIPPED, CANCELED]
        stateReason: {type: string}
        jobId: {type: string, format: uuid, nullable: true}
        validationId: {type: string, format: uuid, nullable: true}
        executionSpecDigest: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, format: int64}

    TaskExecutionList:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/TaskExecution"

    ScriptUploadRequest:
      type: object
      required: [language, script]
      properties:
        language: {type: string, enum: [bash, sh, python]}
        script: {type: string}

    ImportSbatchRequest:
      type: object
      required: [language, script]
      properties:
        language: {type: string, enum: [bash, sh]}
        script: {type: string}

    ImportSbatchResponse:
      type: object
      required: [resources, rewritten, imported, diagnostics]
      properties:
        resources: {type: object}
        partition: {type: string}
        qos: {type: string}
        name: {type: string}
        stdout: {type: string}
        stderr: {type: string}
        working_dir: {type: string}
        rewritten:
          type: string
          description: "Script with each directive line replaced by '# [custos] imported: <original>'"
        imported:
          type: array
          items: {type: string}
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/Diagnostic"

    Diagnostic:
      type: object
      required: [source, code, severity, message]
      properties:
        source: {type: string}
        code: {type: string}
        severity: {type: string, enum: [INFO, WARNING, ERROR, POLICY_VIOLATION, SECURITY_VIOLATION]}
        line: {type: integer}
        column: {type: integer}
        endLine: {type: integer}
        endColumn: {type: integer}
        message: {type: string}
        field: {type: string}
        fix: {type: string}

    ValidationErrorBody:
      type: object
      required: [error]
      description: >
        422 body for script-validation and admission failures: the normal
        error envelope plus the diagnostic list.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/Diagnostic"

  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque keyset cursor from a previous list response.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    TenantSlug:
      name: tenant
      in: path
      required: true
      description: Tenant slug or uuid.
      schema:
        type: string
    UserRef:
      name: user
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupRef:
      name: group
      in: path
      required: true
      description: Group uuid or name.
      schema:
        type: string
    RuleRef:
      name: rule
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleRef:
      name: role
      in: path
      required: true
      schema:
        type: string
        enum: [platform-admin, platform-auditor]
    ProjectRef:
      name: project
      in: path
      required: true
      description: Project slug or uuid.
      schema:
        type: string
    BindingRef:
      name: binding
      in: path
      required: true
      schema:
        type: string
    WorkflowId:
      name: workflow
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionId:
      name: version
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskName:
      name: task
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClusterRef:
      name: cluster
      in: path
      required: true
      description: Cluster name or uuid.
      schema:
        type: string
    Idempotency-Key:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        minLength: 1
        maxLength: 128
    X-Request-ID:
      name: X-Request-ID
      in: header
      description: Client-supplied request id; echoed back on responses.
      schema:
        type: string
        maxLength: 128
