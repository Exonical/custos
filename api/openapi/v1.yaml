        "403":
          description: Requires cluster.assign.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Cluster not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /clusters/{cluster}/tenants/{tenant}:
    put:
      summary: Assign a cluster to a tenant
      operationId: assignCluster
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClusterRef"
        - $ref: "#/components/parameters/TenantSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentPut"
      responses:
        "204":
          description: Assignment upserted.
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires cluster.assign.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Cluster or tenant not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: Cluster visibility is all_tenants (rows are sync-managed).
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    delete:
      summary: Unassign a cluster from a tenant
      operationId: unassignCluster
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClusterRef"
        - $ref: "#/components/parameters/TenantSlug"
      responses:
        "204":
          description: Assignment removed.
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires cluster.assign.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Cluster or tenant not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: Cluster visibility is all_tenants (rows are sync-managed).
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /clusters/{cluster}/node-config:
    get:
      summary: Get the node configuration (cluster.manage, platform-admin)
      operationId: getClusterNodeConfig
      description: >
        Admin-managed NFS mounts and prolog/epilog hooks installed on the
        cluster's compute nodes (ADR-032). A cluster without a stored
        configuration returns the defaults with revision 0 and version 0.
        Warnings are non-blocking.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClusterRef"
      responses:
        "200":
          description: Configuration with warnings.
          content: {application/json: {schema: {$ref: "#/components/schemas/NodeConfigView"}}}
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires cluster.manage.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Cluster not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    put:
      summary: Replace the node configuration (cluster.manage, platform-admin)
      operationId: putClusterNodeConfig
      description: >
        Validates and stores the configuration. version is the stored
        version (0 to create). Every successful write bumps revision.
        Audited as cluster.node_config.updated without script bodies.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClusterRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeConfigUpdate"
      responses:
        "200":
          description: Stored configuration with warnings.
          content: {application/json: {schema: {$ref: "#/components/schemas/NodeConfigView"}}}
        "400":
          description: Malformed body or unknown field.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires cluster.manage.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Cluster not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: VERSION_CONFLICT.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "422":
          description: >
            NODE_MOUNT_INVALID, NODE_HOOK_INVALID or NODE_CONFIG_INVALID with
            path-addressed details (unknown, deleted or unassigned tenants
            are NODE_MOUNT_INVALID at tenant_mounts[i].tenant).
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /clusters/{cluster}/node-config/bundle:
    get:
      summary: Download the rendered node bundle (cluster.manage, platform-admin)
      operationId: downloadClusterNodeBundle
      description: >
        Deterministic gzip tar of the scripts, mounts table, pull agent and
        README for the current configuration and bindings. The ETag is the
        sha256 of the archive.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClusterRef"
      responses:
        "200":
          description: custos-node-<cluster>-r<revision>.tar.gz.
          headers:
            Content-Disposition: {schema: {type: string}}
            ETag: {schema: {type: string}}
            X-Custos-Revision: {schema: {type: integer, format: int64}}
          content:
            application/gzip: {schema: {type: string, format: binary}}
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires cluster.manage.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Cluster not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /clusters/{cluster}/node-tokens:
    get:
      summary: List node pull tokens (cluster.manage, platform-admin)
      operationId: listClusterNodeTokens
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClusterRef"
      responses:
        "200":
          description: Token metadata; secrets are never returned.
          content: {application/json: {schema: {$ref: "#/components/schemas/NodeTokenList"}}}
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires cluster.manage.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Cluster not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    post:
      summary: Create a node pull token (cluster.manage, platform-admin)
      operationId: createClusterNodeToken
      description: >
        Returns the token exactly once (cnt_ + 32 random bytes base64url);
        only its sha256 is stored.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClusterRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeTokenCreate"
      responses:
        "201":
          description: Token created.
          content: {application/json: {schema: {$ref: "#/components/schemas/NodeTokenCreated"}}}
        "400":
          description: Malformed body.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires cluster.manage.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Cluster not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "422":
          description: NODE_TOKEN_INVALID (name must match ^[a-z0-9][a-z0-9-]{0,62}$).
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /clusters/{cluster}/node-tokens/{token}:
    delete:
      summary: Revoke a node pull token (cluster.manage, platform-admin)
      operationId: revokeClusterNodeToken
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClusterRef"
        - name: token
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204":
          description: Revoked (idempotent).
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires cluster.manage.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Cluster or token not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /clusters/{cluster}/node-status:
    get:
      summary: Which bundle each node last fetched (cluster.manage, platform-admin)
      operationId: getClusterNodeStatus
      description: >
        A node is stale when the sha256 of the bundle it last fetched differs
        from the bundle that would be served now; bindings change the
        bundle without bumping the configuration revision.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClusterRef"
      responses:
        "200":
          description: Per-node status plus the current bundle identity.
          content: {application/json: {schema: {$ref: "#/components/schemas/NodeStatusList"}}}
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires cluster.manage.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Cluster not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /node/bundle:
    get:
      summary: Pull the node bundle with a node token (no OIDC)
      operationId: pullNodeBundle
      description: >
        Called by custos-node-sync on compute nodes. Authenticates with a
        node token (Authorization Bearer cnt_...) and names the node in
        X-Custos-Node. Supports If-None-Match with the bundle sha256.
        Rate limited per client address. The token is never logged.
      security:
        - nodeToken: []
      parameters:
        - name: X-Custos-Node
          in: header
          required: true
          description: Slurm node name, ^[A-Za-z0-9._-]{1,128}$.
          schema: {type: string}
        - name: If-None-Match
          in: header
          required: false
          schema: {type: string}
      responses:
        "200":
          description: The bundle.
          headers:
            ETag: {schema: {type: string}}
            X-Custos-Revision: {schema: {type: integer, format: int64}}
          content:
            application/gzip: {schema: {type: string, format: binary}}
        "304":
          description: Not modified.
        "400":
          description: NODE_NAME_INVALID.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "401":
          description: NODE_TOKEN_INVALID (unknown, malformed or revoked token).
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: CLUSTER_DISABLED.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "429":
          description: Rate limited.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/clusters:
    get:
      summary: List clusters visible to the tenant
      operationId: listTenantClusters
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
