        after: {type: object, additionalProperties: true}
    Allocation:
      type: object
      required: [id, tenant_id, project_id, binding_id, name, unit, limit_amount, period_start, period_end, enforcement, consumed_amount, consumed_as_of, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        binding_id: {type: string, format: uuid}
        name: {type: string}
        unit: {type: string, enum: [cpu_hours, gpu_hours, node_hours]}
        limit_amount: {type: number, format: decimal}
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        enforcement: {type: string, enum: [hard, soft]}
        consumed_amount: {type: number, format: decimal}
        consumed_as_of: {type: [string, "null"], format: date-time}
        version: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    AllocationList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Allocation"}}

    CreateAllocation:
      type: object
      required: [binding_id, name, unit, limit_amount, period_start, period_end, enforcement]
      properties:
        binding_id: {type: string, format: uuid}
        name: {type: string}
        unit: {type: string, enum: [cpu_hours, gpu_hours, node_hours]}
        limit_amount: {type: number, minimum: 0}
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        enforcement: {type: string, enum: [hard, soft]}
    UpdateAllocation:
      type: object
      required: [version]
      properties:
        name: {type: string}
        unit: {type: string, enum: [cpu_hours, gpu_hours, node_hours]}
        limit_amount: {type: number, minimum: 0}
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
        enforcement: {type: string, enum: [hard, soft]}
        version: {type: integer}

    SecretUse:
      type: object
      required: [ref, use]
      additionalProperties: false
      properties:
        ref:
          type: string
          description: SecretReference name in the tenant.
        use:
          type: string
          enum: [env, wrapped_token, image_pull]
        envName:
          type: string
          pattern: "^[A-Z_][A-Z0-9_]*$"
          description: Env-mode variable name; defaults to upper-snake handle.

    ConnectorAuthConfig:
      type: object
      additionalProperties: false
      required: [method]
      properties:
        method: {type: string, enum: [token, approle, jwt]}
        role_id: {type: string, description: Non-secret AppRole identifier.}
        role: {type: string, description: Non-secret JWT role selector.}

    ConnectorConfig:
      type: object
      description: Allow-listed non-secret connector configuration. Credentials are supplied separately.
      additionalProperties: false
      properties:
        address: {type: string}
        ca_pem: {type: string, description: Pinned public CA certificate.}
        namespace: {type: string}
        mount: {type: string}
        auth: {$ref: "#/components/schemas/ConnectorAuthConfig"}

    SecretConnector:
      type: object
      required: [id, tenant_id, name, kind, state, config, has_credential, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        name: {type: string}
        kind: {type: string, enum: [platform-openbao, openbao]}
        state: {type: string, enum: [active, disabled]}
        config: {$ref: "#/components/schemas/ConnectorConfig"}
        has_credential: {type: boolean, description: True only when a BYO connector credential is stored.}
        version: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    SecretConnectorList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/SecretConnector"}}

    CreateSecretConnector:
      type: object
      additionalProperties: false
      required: [name, kind, config, credential]
      properties:
        name: {type: string}
        kind: {type: string, enum: [openbao]}
        config: {$ref: "#/components/schemas/ConnectorConfig"}
        credential:
          type: object
          additionalProperties: {type: string}
          writeOnly: true

    UpdateSecretConnector:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        name: {type: string}
        state: {type: string, enum: [active, disabled]}
        config:
          anyOf:
            - {$ref: "#/components/schemas/ConnectorConfig"}
            - {type: "null"}
        credential:
          type: object
          additionalProperties: {type: string}
          writeOnly: true
        version: {type: integer, format: int64}

    SecretReference:
      type: object
      required: [id, tenant_id, owner_id, project_id, name, connector_id, namespace, mount, path, key, secret_version, kind, allowed_uses, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        owner_id: {type: [string, "null"], format: uuid}
        project_id: {type: [string, "null"], format: uuid}
        name: {type: string}
        connector_id: {type: string, format: uuid}
        namespace: {type: string}
        mount: {type: string}
        path: {type: string}
        key: {type: string}
        secret_version: {type: [integer, "null"], minimum: 1}
        kind: {type: string, enum: [ssh_key, slurm_token, api_token, generic, storage_credential]}
        allowed_uses:
          type: array
          items: {type: string, enum: [workflow_env, wrapped_token, image_pull]}
        version: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    SecretReferenceList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/SecretReference"}}

    CreateSecretReference:
      type: object
      required: [name, path, key, kind]
      properties:
        name: {type: string}
        connector: {type: string, default: default}
        owner_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        mount: {type: string}
        path: {type: string}
        key: {type: string}
        secret_version: {type: integer, minimum: 1}
        kind: {type: string, enum: [ssh_key, slurm_token, api_token, generic, storage_credential]}
        allowed_uses:
          type: array
          items: {type: string, enum: [workflow_env, wrapped_token, image_pull]}

    SecretRef:
      type: object
      description: Reference to a secret value (docs/secrets.md); never the value.
      required: [provider, path]
      properties:
        provider:
          type: string
          enum: [file, openbao]
        namespace:
          type: string
          description: OpenBao namespace; required for openbao references.
        mount:
          type: string
          description: OpenBao KV v2 mount; required for openbao references.
        path:
          type: string
        key:
          type: string
          description: Field within the secret document.
        version:
          type: integer
          minimum: 1
          description: Optional pinned OpenBao KV version.

    AssignmentDefaults:
      type: object
      properties:
        default_account_prefix:
          type: string
        allowed_partitions:
          type: array
          items:
            type: string

    ContainerRuntime:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [apptainer, pyxis]
        binary:
          type: string
          default: apptainer
          maxLength: 128
          pattern: '^[A-Za-z0-9_.:@/=-]+$'
          description: Apptainer executable; defaults to apptainer and is unused by pyxis.
        allowed_image_prefixes:
          type: array
          items:
            type: string
            maxLength: 512
            pattern: '^(docker|oras)://[A-Za-z0-9._/:@+-]+$|^/[A-Za-z0-9._/+-]+$'
        require_digest:
          type: boolean
        slurm_in_container:
          type: boolean
          description: Required for generic multinode tasks whose remote launcher runs from inside the image.
        mpi_plugin:
          type: string
          default: pmix
          pattern: '^[a-z0-9_]+$'

    Cluster:
      type: object
      required: [id, name, display_name, base_url, api_version, identity_mode,
                 service_user, policy_management, policy_parent_account, token_ref,
                 container_runtime, visibility, state, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        display_name:
          type: string
        base_url:
          type: string
        api_version:
          type: string
          enum: [v0.0.45, v0.0.44]
        ca_bundle_pem:
          type: string
        identity_mode:
          type: string
          enum: [service, impersonate]
        service_user:
          type: string
        policy_management:
          type: string
          enum: [inherit, enforce, report]
        policy_parent_account:
          type: string
        software_modules:
          type: array
          description: Site map from workflow software requirements to environment modules (ADR-023).
          items:
            $ref: "#/components/schemas/SoftwareModule"
        container_runtime:
          allOf:
            - $ref: "#/components/schemas/ContainerRuntime"
          nullable: true
          description: Null means image execution is unavailable on this cluster.
        token_ref:
          $ref: "#/components/schemas/SecretRef"
        client_cert_ref:
          $ref: "#/components/schemas/SecretRef"
        visibility:
          type: string
          enum: [assigned, all_tenants]
        state:
          type: string
          enum: [active, degraded, unreachable, disabled]
        consecutive_failures:
          type: integer
        last_sync_at:
          type: string
          format: date-time
        last_error:
          type: string
        capabilities_at:
          type: string
          format: date-time
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ClusterCreate:
      type: object
      required: [name, display_name, base_url, api_version, identity_mode,
                 service_user, token_ref, visibility]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
        display_name:
          type: string
        base_url:
          type: string
          description: https URL of slurmrestd; vetted against the SSRF dial policy.
        api_version:
          type: string
          enum: [v0.0.45, v0.0.44]
        ca_bundle_pem:
          type: string
        identity_mode:
          type: string
          enum: [service, impersonate]
        service_user:
          type: string
        policy_management:
          type: string
          enum: [inherit, enforce, report]
        policy_parent_account:
          type: string
        software_modules:
          type: array
          description: Site map from workflow software requirements to environment modules (ADR-023).
          items:
            $ref: "#/components/schemas/SoftwareModule"
        container_runtime:
          allOf:
            - $ref: "#/components/schemas/ContainerRuntime"
          nullable: true
          description: Null means image execution is unavailable on this cluster.
        token_ref:
          $ref: "#/components/schemas/SecretRef"
        client_cert_ref:
          $ref: "#/components/schemas/SecretRef"
        visibility:
          type: string
          enum: [assigned, all_tenants]

    ClusterUpdate:
      type: object
      required: [version]
      properties:
        display_name:
          type: string
        base_url:
          type: string
        api_version:
          type: string
          enum: [v0.0.45, v0.0.44]
        ca_bundle_pem:
          type: string
        identity_mode:
          type: string
          enum: [service, impersonate]
        service_user:
          type: string
        policy_management:
          type: string
          enum: [inherit, enforce, report]
        policy_parent_account:
          type: string
        software_modules:
          type: array
          description: Site map from workflow software requirements to environment modules (ADR-023).
          items:
            $ref: "#/components/schemas/SoftwareModule"
        container_runtime:
          allOf:
            - $ref: "#/components/schemas/ContainerRuntime"
          nullable: true
          description: Null means image execution is unavailable on this cluster.
        token_ref:
          $ref: "#/components/schemas/SecretRef"
        client_cert_ref:
          $ref: "#/components/schemas/SecretRef"
        visibility:
          type: string
          enum: [assigned, all_tenants]
        version:
          type: integer
          description: Optimistic concurrency token.

    ClusterTestResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        latency_ms:
          type: integer
        slurm_version:
          type: string
        api_version:
          type: string
        partitions:
          type: array
          items:
            type: string
        error_code:
          type: string

    Assignment:
      type: object
      required: [cluster_id, tenant_id, source, defaults, created_at, updated_at]
      properties:
        cluster_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        source:
          type: string
          enum: [manual, auto]
        defaults:
          $ref: "#/components/schemas/AssignmentDefaults"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AssignmentPut:
      type: object
      properties:
        defaults:
          $ref: "#/components/schemas/AssignmentDefaults"

    ClusterSummary:
      type: object
      description: Tenant-facing view; exposes only the container runtime type and never returns base_url, token_ref, ca_bundle, or the full runtime configuration.
      required: [id, name, display_name, state, partitions, defaults, container_runtime]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        display_name:
          type: string
        state:
          type: string
          enum: [active, degraded, unreachable, disabled]
        slurm_version:
          type: string
        partitions:
          type: array
          items:
            type: string
        gres_types:
          type: array
          items:
            type: string
        node_summary:
          type: object
          additionalProperties:
            type: integer
        defaults:
          $ref: "#/components/schemas/AssignmentDefaults"
        container_runtime:
          allOf:
            - $ref: "#/components/schemas/ContainerRuntimeSummary"
          nullable: true
          description: Exposes only the runtime type to tenant users.

    ContainerRuntimeSummary:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [apptainer, pyxis]

    PartitionRecord:
      type: object
      required: [name, attributes, synced_at]
      properties:
        name:
          type: string
        attributes:
          type: object
          description: slurm.Partition neutral attributes.
        synced_at:
          type: string
          format: date-time

    ClusterList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Cluster"
        next_cursor:
          type: string
          nullable: true

    AssignmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Assignment"
        next_cursor:
          type: string
          nullable: true

    ClusterSummaryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClusterSummary"

    PartitionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PartitionRecord"

    AccountingUsageRow:
      type: object
      required: [key, jobs, failed, cpu_hours, gpu_hours, node_hours, mem_gb_hours, wait_hours, run_hours]
      properties:
        key: {type: string}
        jobs: {type: integer, format: int64}
        failed: {type: integer, format: int64}
        cpu_hours: {type: number, format: double}
        gpu_hours: {type: number, format: double}
        node_hours: {type: number, format: double}
        mem_gb_hours: {type: number, format: double}
        wait_hours: {type: number, format: double}
        run_hours: {type: number, format: double}
        energy_joules: {type: [integer, "null"], format: int64}
        wait_p50: {type: [number, "null"]}
        wait_p90: {type: [number, "null"]}
        wait_p99: {type: [number, "null"]}
        run_p50: {type: [number, "null"]}
        run_p90: {type: [number, "null"]}
        run_p99: {type: [number, "null"]}
    AccountingUsageList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AccountingUsageRow"}}
        next_cursor: {type: string}

    AccountingTopRow:
      type: object
      required: [key, value]
      properties:
        key: {type: string}
        value: {type: integer, format: int64}

    AccountingTopList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AccountingTopRow"}}

    AccountingAllocationItem:
      type: object
      required: [allocation, consumed, remaining, percent_used, as_of, active]
      properties:
        allocation: {$ref: "#/components/schemas/Allocation"}
        consumed: {type: number, format: double}
        remaining: {type: number, format: double}
        percent_used: {type: number, format: double}
        as_of: {type: [string, "null"], format: date-time}
        active: {type: boolean}

    AccountingAllocationList:
      type: object
      required: [items]
      properties:
        items: {type: [array, "null"], items: {$ref: "#/components/schemas/AccountingAllocationItem"}}

    Job:
      type: object
      required: [id, tenant_id, project_id, cluster_id, created_by, name,
                 state, resource_request, script_digest, script_language,
                 version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        cluster_id: {type: string, format: uuid}
        created_by: {type: string, format: uuid}
        name: {type: string}
        state:
          type: string
          enum: [SUBMITTING, QUEUED, RUNNING, COMPLETED, FAILED, CANCELED]
        state_reason: {type: string}
        slurm_job_id: {type: integer, format: int64}
        slurm_state: {type: string}
        exit_code: {type: integer}
        exit_signal: {type: integer}
        resource_request: {type: object}
        resource_usage:
          type: object
          description: Ended-job accounting usage correlated from slurmdbd.
          additionalProperties: true
        script_digest: {type: string, description: "sha256:<hex>"}
        script_language: {type: string}
        execution_spec_id: {type: string, description: "sha256:<hex> digest of the immutable ExecutionSpec"}
        validation_id: {type: string, format: uuid, description: "ScriptValidation that admitted this job"}
        submitted_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time}
        last_reconciled_at: {type: string, format: date-time}
        version: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    JobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        next_cursor:
          type: string
          nullable: true

    JobSubmit:
      type: object
      required: [cluster, resources]
      properties:
        name: {type: string, maxLength: 128}
        cluster:
          type: string
          description: Cluster name or uuid.
        partition: {type: string}
        qos: {type: string}
        resources:
          type: object
          description: Resource request (workflowspec.Resources shape).
        script:
          type: object
          required: [language, body]
          properties:
            language: {type: string, enum: [bash, sh]}
            body: {type: string}
        script_ref:
          type: string
          description: "Digest of a previously stored script: sha256:<hex>"
        env:
          type: object
          additionalProperties: {type: string}
        secrets:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SecretUse"
        working_dir: {type: string}
        args:
          type: array
          items: {type: string}
        stdout: {type: string}
        stderr: {type: string}

    ValidationPolicy:
      type: object
      description: ValidationPolicy (docs/script-validation.md).
      properties:
        blockAt: {type: string, enum: [INFO, WARNING, ERROR]}
        overrides:
          type: array
          items:
            type: object
            required: [source, code, severity]
            properties:
              source: {type: string}
              code: {type: string}
              severity: {type: string, enum: [INFO, WARNING, ERROR]}
        disabledCodes:
          type: array
          items: {type: string}
          description: Only non-CUSTOS codes (e.g. shellcheck) may be disabled.
        shellcheckShell: {type: string, enum: [bash, sh, dash, ksh]}
        allowShellTasks: {type: boolean}
        allowLegacySbatchImport: {type: boolean}
        forbiddenCommands:
          type: array
          items: {type: string}
        forbiddenCommandsSeverity: {type: string, enum: [INFO, WARNING, ERROR]}
        filteredEnvAllow:
          type: array
          items: {type: string}

    ValidationPolicyRequest:
      type: object
      required: [policy, version]
      properties:
        policy:
          $ref: "#/components/schemas/ValidationPolicy"
        version:
          type: integer
          format: int64
          description: Expected current version; 0 creates.

    ValidationPolicyResponse:
      type: object
      required: [policy, version]
      properties:
        policy:
          $ref: "#/components/schemas/ValidationPolicy"
        version:
          type: integer
          format: int64

    ScriptValidateRequest:
      type: object
      required: [language, script]
      properties:
        language: {type: string, enum: [bash, sh, python, yaml, json]}
        script: {type: string}
        resources: {type: object}
        environment:
          type: object
          additionalProperties: {type: string}
        software:
          type: array
          items: {type: object}
        cluster: {type: string, description: "Cluster name or uuid"}

    ScriptValidateResponse:
      type: object
      required: [valid, digest, blockAt, diagnostics, toolVersions, effectivePolicy]
      properties:
        valid: {type: boolean}
        digest: {type: string, description: "sha256:<hex>"}
        blockAt: {type: string}
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/Diagnostic"
        toolVersions:
          type: object
          additionalProperties: {type: string}
        effectivePolicy:
          type: object
          properties:
            blockAt: {type: string}
            allowShellTasks: {type: boolean}
            allowLegacySbatchImport: {type: boolean}
            filteredEnvAllowed:
              type: array
              items: {type: string}

    SoftwareModule:
      type: object
      required: [name, modules]
      properties:
        name: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.+-]{0,63}$"}
        version:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.+-]{0,63}$"
          description: Omit to match any requested version; an exact match wins.
        modules:
          type: array
          minItems: 1
          maxItems: 16
          items: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_.+/@-]{0,127}$"}

    WorkflowTemplateSummary:
      type: object
      required: [id, title, summary, description, tags]
      properties:
        id: {type: string}
        title: {type: string}
        summary: {type: string}
        description: {type: string}
        tags:
          type: object
          description: Free-form key/value metadata; empty when unset.
          additionalProperties: {type: string}

    WorkflowTemplateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowTemplateSummary"

    WorkflowTemplate:
      allOf:
        - $ref: "#/components/schemas/WorkflowTemplateSummary"
        - type: object
          required: [spec, yaml]
          properties:
            spec:
              type: object
              description: Canonical custos.io/v1alpha1 workflow document.
            yaml:
              type: string
              description: The same document as YAML, in authored key order.

    Workflow:
      type: object
      required: [id, tenantId, projectId, name, state, version]
      properties:
        id: {type: string, format: uuid}
        tenantId: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        state: {type: string, enum: [active, archived]}
        latestPublishedVersionId: {type: string, format: uuid, nullable: true}
        version: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}

    WorkflowVersion:
      type: object
      required: [id, workflowId, number, state, schemaVersion, specHash, version]
      properties:
        id: {type: string, format: uuid}
        workflowId: {type: string, format: uuid}
        number: {type: integer}
        state: {type: string, enum: [draft, published, deprecated]}
        schemaVersion: {type: string}
        specHash: {type: string}
        layout: {type: object}
        spec: {type: object}
        version: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        publishedAt: {type: string, format: date-time, nullable: true}

    WorkflowExecuteRequest:
      type: object
      required: [workflow]
      properties:
        workflow:
          type: string
          format: uuid
          description: Workflow uuid.
        version:
          type: string
          format: uuid
          description: Version uuid; defaults to the latest published version.
        parameters:
          type: object
          additionalProperties: true
          description: Runtime parameter values validated against spec.parameters.
        test:
          type: boolean
          default: false
          description: Test a draft version; requires an explicit version and workflow.create plus workflow.execute.

    WorkflowExecution:
      type: object
      required: [id, tenantId, projectId, workflowId, workflowVersionId, state, requestedBy, version]
      properties:
        id: {type: string, format: uuid}
        tenantId: {type: string, format: uuid}
        projectId: {type: string, format: uuid}
        workflowId: {type: string, format: uuid}
        workflowVersionId: {type: string, format: uuid}
        test: {type: boolean}
        specHash: {type: string}
        parameters: {type: object}
        strategy: {type: string, enum: [auto, engine, native]}
        state:
          type: string
          enum: [PENDING, VALIDATING, QUEUED, RUNNING, SUCCEEDED, FAILED, PARTIAL_FAILURE, CANCELING, CANCELED]
        stateReason: {type: string}
        requestedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time, nullable: true}
        endedAt: {type: string, format: date-time, nullable: true}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, format: int64}

    WorkflowExecutionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowExecution"
        next_cursor: {type: string, nullable: true}

    TaskExecution:
      type: object
      required: [id, executionId, taskName, index, count, attempt, state, version]
      properties:
        id: {type: string, format: uuid}
        executionId: {type: string, format: uuid}
        taskName: {type: string}
        index: {type: integer}
        count: {type: integer}
        attempt: {type: integer}
        state:
          type: string
          enum: [PENDING, BLOCKED, READY, ADMITTING, SUBMITTING, QUEUED, RUNNING, COMPLETED, FAILED, SKIPPED, CANCELED]
        stateReason: {type: string}
        jobId: {type: string, format: uuid, nullable: true}
        validationId: {type: string, format: uuid, nullable: true}
        executionSpecDigest: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, format: int64}

    TaskExecutionList:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/TaskExecution"

    ScriptUploadRequest:
      type: object
      required: [language, script]
      properties:
        language: {type: string, enum: [bash, sh, python]}
        script: {type: string}

    ImportSbatchRequest:
      type: object
      required: [language, script]
      properties:
        language: {type: string, enum: [bash, sh]}
        script: {type: string}

    ImportSbatchResponse:
      type: object
      required: [resources, rewritten, imported, diagnostics]
      properties:
        resources: {type: object}
        partition: {type: string}
        qos: {type: string}
        name: {type: string}
        stdout: {type: string}
        stderr: {type: string}
        working_dir: {type: string}
        rewritten:
          type: string
          description: "Script with each directive line replaced by '# [custos] imported: <original>'"
        imported:
          type: array
          items: {type: string}
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/Diagnostic"

    WorkflowSbatchImportRequest:
      type: object
      required: [scripts]
      additionalProperties: false
      properties:
        name: {type: string, maxLength: 256}
        scripts:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/WorkflowSbatchImportScript"

    WorkflowSbatchImportScript:
      type: object
      required: [filename, content]
      additionalProperties: false
      properties:
        filename: {type: string, maxLength: 1024}
        content:
          type: string
          description: Script contents; UTF-8 byte size is limited to 256 KiB.
          maxLength: 262144

    WorkflowSbatchImportDocument:
      type: object
      required: [apiVersion, kind, metadata, spec]
      additionalProperties: false
      properties:
        apiVersion: {type: string, enum: [custos.io/v1alpha1]}
        kind: {type: string, enum: [Workflow]}
        metadata:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name: {type: string}
        spec:
          type: object
          required: [tasks]
          additionalProperties: false
          properties:
            tasks:
              type: array
              items:
                $ref: "#/components/schemas/WorkflowSbatchImportTask"

    WorkflowSbatchImportTask:
      type: object
      required: [name, launch, script]
      additionalProperties: false
      properties:
        name: {type: string}
        launch: {type: string, enum: [sbatch, srun]}
        resources:
          $ref: "#/components/schemas/WorkflowSbatchImportResources"
        script:
          type: object
          required: [ref, language]
          additionalProperties: false
          properties:
            ref: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
            language: {type: string, enum: [bash, sh]}
        array:
          $ref: "#/components/schemas/WorkflowSbatchImportArray"
        partition: {type: string}
        qos: {type: string}
        workingDirectory: {type: string}
        stdout: {type: string}
        stderr: {type: string}

    WorkflowSbatchImportResources:
      type: object
      additionalProperties: false
      properties:
        cpu: {type: integer, minimum: 0}
        nodes: {type: integer, minimum: 0}
        tasks: {type: integer, minimum: 0}
        tasksPerNode: {type: integer, minimum: 0}
        cpusPerTask: {type: integer, minimum: 0}
        memory: {type: string}
        walltime: {type: string}
        memoryPerCpu: {type: string}
        memoryPerNode: {type: string}
        gpu:
          type: object
          required: [count]
          additionalProperties: false
          properties:
            type: {type: string}
            count: {type: integer, minimum: 1}
        licenses:
          type: array
          items: {type: string}
        constraints: {type: string}
        exclusive: {type: boolean}

    WorkflowSbatchImportArray:
      type: object
      required: [start, end]
      additionalProperties: false
      properties:
        start: {type: integer, minimum: 0}
        end: {type: integer, minimum: 0}
        step: {type: integer, minimum: 0}
        maxConcurrent: {type: integer, minimum: 0}

    WorkflowSbatchImportedTask:
      type: object
      required: [filename, task, scriptDigest, imported, diagnostics]
      additionalProperties: false
      properties:
        filename: {type: string}
        task: {type: string}
        scriptDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        imported:
          type: array
          items: {type: string}
        diagnostics:
          type: array
          items: {$ref: "#/components/schemas/Diagnostic"}

    WorkflowSbatchImportResponse:
      type: object
      required: [spec, yaml, tasks]
      additionalProperties: false
      properties:
        spec: {$ref: "#/components/schemas/WorkflowSbatchImportDocument"}
        yaml: {type: string}
        tasks:
          type: array
          items: {$ref: "#/components/schemas/WorkflowSbatchImportedTask"}

    Diagnostic:
      type: object
      required: [source, code, severity, message]
      properties:
        source: {type: string}
        code: {type: string}
        severity: {type: string, enum: [INFO, WARNING, ERROR, POLICY_VIOLATION, SECURITY_VIOLATION]}
        line: {type: integer}
        column: {type: integer}
        endLine: {type: integer}
        endColumn: {type: integer}
        message: {type: string}
        field: {type: string}
        fix: {type: string}

    ValidationErrorBody:
      type: object
      required: [error]
      description: >
        422 body for script-validation and admission failures: the normal
        error envelope plus the diagnostic list.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/Diagnostic"

    NodeMount:
      type: object
      required: [name, fstype, source, target]
      properties:
        name: {type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$"}
        fstype: {type: string, enum: [nfs, nfs4]}
        source: {type: string, maxLength: 512, pattern: "^[A-Za-z0-9.-]+:/[A-Za-z0-9._/-]*$", example: "server:/hpc/apps"}
        target: {type: string, maxLength: 256, example: /apps}
        options:
          type: array
          description: Allow-listed mount options. Default ro (shared) or rw (tenant); tenant mounts always add nosuid,nodev.
          items: {type: string}
    NodeTenantMount:
      type: object
      required: [tenant, name, fstype, source, target]
      properties:
        tenant: {type: string, format: uuid}
        name: {type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$"}
        fstype: {type: string, enum: [nfs, nfs4]}
        source: {type: string, maxLength: 512, pattern: "^[A-Za-z0-9.-]+:/[A-Za-z0-9._/-]*$"}
        target: {type: string, maxLength: 256}
        options: {type: array, items: {type: string}}
    NodeHook:
      type: object
      required: [name, phase, order, script]
      properties:
        name: {type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$"}
        phase: {type: string, enum: [prolog, epilog]}
        order: {type: integer, minimum: 0, maximum: 99}
        script:
          type: string
          maxLength: 65536
          description: "Starts with #!/bin/bash or #!/bin/sh; syntax-checked."
    ClusterNodeConfig:
      type: object
      required: [isolation_mode, mount_timeout_seconds, shared_mounts, tenant_mounts, hooks]
      properties:
        isolation_mode: {type: string, enum: [namespace, tenant_exclusive, node_exclusive], default: namespace}
        tenant_exclusive_mechanism:
          type: string
          enum: [mcs_label, user]
          default: mcs_label
          description: >
            How tenant_exclusive keeps tenants off shared nodes: mcs_label submits
            with --exclusive=mcs and the tenant slug as label (needs mcs/label);
            user submits with --exclusive=user (needs one Slurm user per tenant).
            Ignored in other modes.
        mount_timeout_seconds: {type: integer, minimum: 5, maximum: 300, default: 30}
        shared_mounts: {type: array, items: {$ref: "#/components/schemas/NodeMount"}}
        tenant_mounts: {type: array, items: {$ref: "#/components/schemas/NodeTenantMount"}}
        hooks: {type: array, items: {$ref: "#/components/schemas/NodeHook"}}
    NodeConfigUpdate:
      type: object
      required: [config, version]
      properties:
        config: {$ref: "#/components/schemas/ClusterNodeConfig"}
        version: {type: integer, minimum: 0, description: Stored version; 0 creates.}
    NodeConfigWarning:
      type: object
      required: [code, message]
      properties:
        code: {type: string, enum: [SHARED_SERVICE_USER, NAMESPACE_REQUIRES_SLURM_25_11, TENANT_EXCLUSIVE_SHARED_USER]}
        message: {type: string}
    NodeConfigView:
      type: object
      required: [cluster_id, config, revision, content_sha256, version, warnings]
      properties:
        cluster_id: {type: string, format: uuid}
        config: {$ref: "#/components/schemas/ClusterNodeConfig"}
        revision: {type: integer, format: int64}
        content_sha256: {type: string}
        version: {type: integer}
        updated_at: {type: string, format: date-time}
        updated_by: {type: string, format: uuid}
        warnings: {type: array, items: {$ref: "#/components/schemas/NodeConfigWarning"}}
    NodeTokenCreate:
      type: object
      required: [name]
      properties:
        name: {type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$"}
    NodeToken:
      type: object
      required: [id, cluster_id, name, created_at]
      properties:
        id: {type: string, format: uuid}
        cluster_id: {type: string, format: uuid}
        name: {type: string}
        created_at: {type: string, format: date-time}
        created_by: {type: string, format: uuid}
        last_used_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
    NodeTokenCreated:
      type: object
      required: [id, cluster_id, name, created_at, token]
      properties:
        id: {type: string, format: uuid}
        cluster_id: {type: string, format: uuid}
        name: {type: string}
        created_at: {type: string, format: date-time}
        created_by: {type: string, format: uuid}
        token: {type: string, description: "Shown once: cnt_ + base64url(32 random bytes)."}
    NodeTokenList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/NodeToken"}}
    NodeStatus:
      type: object
      required: [node_name, revision, bundle_sha256, fetched_at, stale]
      properties:
        node_name: {type: string}
        revision: {type: integer, format: int64}
        bundle_sha256: {type: string}
        fetched_at: {type: string, format: date-time}
        stale: {type: boolean}
    NodeStatusList:
      type: object
      required: [current_revision, current_bundle_sha256, items]
      properties:
        current_revision: {type: integer, format: int64}
        current_bundle_sha256: {type: string}
        items: {type: array, items: {$ref: "#/components/schemas/NodeStatus"}}
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque keyset cursor from a previous list response.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    TenantSlug:
      name: tenant
      in: path
      required: true
      description: Tenant slug or uuid.
      schema:
        type: string
    UserRef:
      name: user
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupRef:
      name: group
      in: path
      required: true
      description: Group uuid or name.
      schema:
        type: string
    RuleRef:
      name: rule
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleRef:
      name: role
      in: path
      required: true
      schema:
        type: string
        enum: [platform-admin, platform-auditor]
    ProjectRef:
      name: project
      in: path
      required: true
      description: Project slug or uuid.
      schema:
        type: string
    BindingRef:
      name: binding
      in: path
      required: true
      schema:
        type: string
    WorkflowId:
      name: workflow
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionId:
      name: version
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskName:
      name: task
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClusterRef:
      name: cluster
      in: path
      required: true
      description: Cluster name or uuid.
      schema:
        type: string
    Idempotency-Key:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        minLength: 1
        maxLength: 128
    X-Request-ID:
      name: X-Request-ID
      in: header
      description: Client-supplied request id; echoed back on responses.
      schema:
        type: string
        maxLength: 128
