          type: string
          enum: [user, service]

    UserLookupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserLookupResult"

    PolicySyncSummary:
      type: object
      required: [cluster_id, mode, bindings, drifted, unknown, errors, ops_applied, ops_failed]
