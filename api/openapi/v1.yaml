        "409":
          description: LAST_ADMIN.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/projects/{project}/cluster-bindings:
    get:
      summary: List project cluster bindings (project.read or membership)
      operationId: listClusterBindings
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/ProjectRef"
      responses:
        "200":
          description: Binding list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterBindingList"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Project not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    post:
      summary: Create a cluster binding (project.manage; cluster must be tenant-assigned)
      operationId: createClusterBinding
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/ProjectRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterBindingUpsert"
      responses:
        "201":
          description: Binding created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterBinding"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires project.manage.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Project not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: A binding for this cluster already exists.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "422":
          description: CLUSTER_NOT_ASSIGNED, PARTITION_NOT_ALLOWED, or ACCOUNT_PREFIX.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/projects/{project}/cluster-bindings/{binding}:
    get:
      summary: Get a cluster binding (project.read or membership)
      operationId: getClusterBinding
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/ProjectRef"
        - $ref: "#/components/parameters/BindingRef"
      responses:
        "200":
          description: Binding detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterBinding"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Binding not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    patch:
      summary: Update a cluster binding (project.manage; revalidates constraints)
      operationId: updateClusterBinding
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/ProjectRef"
        - $ref: "#/components/parameters/BindingRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterBindingUpsert"
      responses:
        "200":
          description: Updated binding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterBinding"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Binding not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: Version conflict.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "422":
          description: CLUSTER_NOT_ASSIGNED, PARTITION_NOT_ALLOWED, or ACCOUNT_PREFIX.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    delete:
      summary: Delete a cluster binding (project.manage)
      operationId: deleteClusterBinding
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/ProjectRef"
        - $ref: "#/components/parameters/BindingRef"
      responses:
        "204":
          description: Binding deleted.
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Binding not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/policies/resource:
    get:
      summary: Get the tenant resource policy (policy.read)
      operationId: getTenantResourcePolicy
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      responses:
        "200":
          description: Resource policy (empty object when unset).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourcePolicyResponse"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Tenant not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    put:
      summary: Replace the tenant resource policy (policy.manage)
      operationId: setTenantResourcePolicy
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourcePolicyRequest"
      responses:
        "200":
          description: Policy stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourcePolicyResponse"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires policy.manage.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/projects/{project}/policies/resource:
    get:
      summary: Get the project resource policy (policy.read)
      operationId: getProjectResourcePolicy
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/ProjectRef"
      responses:
        "200":
          description: Resource policy (empty object when unset).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourcePolicyResponse"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Project not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    put:
      summary: Replace the project resource policy (policy.manage at tenant level)
      operationId: setProjectResourcePolicy
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/ProjectRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourcePolicyRequest"
      responses:
        "200":
          description: Policy stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourcePolicyResponse"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires policy.manage.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Project not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/scripts/validate:
    post:
      summary: Validate a script ad hoc (workflow.create; rate-limited)
      operationId: validateScript
      description: >
        Runs the validation pipeline with the effective policy
        (tenant ∩ cluster when `cluster` is given) and persists the
        ScriptValidation. The script bytes are stored so the returned
        digest can be referenced by a job or task.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptValidateRequest"
      responses:
        "200":
          description: Validation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScriptValidateResponse"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires workflow.create.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "413":
          description: Body exceeds script limit + envelope.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "429":
          description: Per-principal validation rate limit exceeded.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/scripts/import-sbatch:
    post:
      summary: Convert legacy #SBATCH directives into a resource proposal (workflow.create)
      operationId: importSbatch
      description: >
        Returns the proposed resources/placement plus the rewritten
        script (directive lines replaced by "# [custos] imported:").
        403 IMPORT_DISABLED when the effective policy has
        allowLegacySbatchImport=false.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportSbatchRequest"
      responses:
        "200":
          description: Import proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSbatchResponse"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires workflow.create or import disabled.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "429":
          description: Per-principal validation rate limit exceeded.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/workflow-imports/sbatch:
    post:
      summary: Import multiple sbatch scripts as a new workflow draft proposal
      operationId: importWorkflowSbatch
      description: >
        Imports 1-20 scripts (each at most 256 KiB), stores only the
        directive-rewritten payloads, and returns a validated workflow
        document proposal. It does not create a Workflow or WorkflowVersion.
        Import is enabled by default and can be disabled by effective policy.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowSbatchImportRequest"
      responses:
        "200":
          description: New workflow document and per-script import diagnostics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowSbatchImportResponse"
        "400":
          description: Malformed request or script count out of range.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires workflow.create or import disabled by effective policy.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "413":
          description: Request exceeds the multi-script import body limit.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "422":
          description: One or more scripts could not be parsed or stored, or the assembled document is invalid.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "429":
          description: Per-principal import rate limit exceeded.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/scripts:
    post:
      summary: Store a script for later reference (workflow.create; rate-limited)
      operationId: uploadScript
      description: >
        Stores the script bytes and returns its sha256 digest, which
        workflow tasks reference as `script.ref`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptUploadRequest"
      responses:
        "200":
          description: Stored digest and size.
          content:
            application/json:
              schema:
                type: object
                properties:
                  digest: {type: string}
                  size: {type: integer}
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires workflow.create.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "429":
          description: Per-principal validation rate limit exceeded.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /schemas/workflow/v1alpha1:
    get:
      summary: Workflow document JSON Schema (unauthenticated)
      operationId: getWorkflowSchema
      security: []
      responses:
        "200":
          description: The custos.io/v1alpha1 JSON Schema.
          content:
            application/schema+json:
              schema: {type: object}
        "304":
          description: Cached schema unchanged.

  /workflow-templates:
    get:
      summary: List built-in workflow templates (any authenticated principal)
      operationId: listWorkflowTemplates
      description: >
        Platform-provided starter documents (ADR-024). Using one is an
        ordinary createWorkflow followed by createWorkflowVersion with
        the template's spec, under the caller's own permissions.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Template summaries in catalog order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowTemplateList"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /workflow-templates/{template}:
    get:
      summary: Get a built-in workflow template with its document
      operationId: getWorkflowTemplate
      security:
        - bearerAuth: []
      parameters:
        - name: template
          in: path
          required: true
          description: Template id.
          schema: {type: string, pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"}
      responses:
        "200":
          description: The template, its canonical spec and a YAML rendering.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowTemplate"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Unknown template.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/workflows:
    post:
      summary: Create a workflow (workflow.create on the project)
      operationId: createWorkflow
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, name]
              properties:
                project: {type: string, format: uuid}
                name: {type: string}
                description: {type: string}
      responses:
        "201":
          description: Created workflow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires workflow.create.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    get:
      summary: List workflows (optional ?project=uuid filter)
      operationId: listWorkflows
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - name: project
          in: query
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Workflows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflows:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workflow"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/workflows/{workflow}:
    get:
      summary: Get a workflow
      operationId: getWorkflow
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
      responses:
        "200":
          description: The workflow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "404":
          description: Unknown workflow.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    patch:
      summary: Edit workflow metadata (optimistic version)
      operationId: patchWorkflow
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                description: {type: string}
                version: {type: integer, format: int64}
      responses:
        "200":
          description: Updated workflow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "409":
          description: Stale version.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    delete:
      summary: Archive a workflow
      operationId: archiveWorkflow
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
        - name: X-Expected-Version
          in: header
          schema: {type: integer, format: int64}
      responses:
        "204":
          description: Archived.

  /tenants/{tenant}/workflows/{workflow}/versions:
    post:
      summary: Create a draft version from a YAML/JSON document
      operationId: createWorkflowVersion
      description: >
        Body is the workflow document (application/yaml or
        application/json, 4 MiB max). Runs validation steps 1-4; a
        draft is stored with number = max+1, canonical spec and
        sha256 hash. 422 SPEC_INVALID carries path-addressed details.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
      requestBody:
        required: true
        content:
          application/yaml:
            schema: {type: string}
          application/json:
            schema: {type: object}
      responses:
        "201":
          description: Created draft version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowVersion"
        "422":
          description: Spec validation failed (details[] list every error).
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    get:
      summary: List versions (newest first)
      operationId: listWorkflowVersions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
      responses:
        "200":
          description: Versions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkflowVersion"

  /tenants/{tenant}/workflows/{workflow}/versions/validate:
    post:
      summary: Run the full validation pipeline (steps 1-8) without persisting
      operationId: validateWorkflowVersionBody
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
      requestBody:
        required: true
        content:
          application/yaml:
            schema: {type: string}
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: Validation result; errors[] is empty when valid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: {type: boolean}
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        path: {type: string}
                        code: {type: string}
                        message: {type: string}

  /tenants/{tenant}/workflows/{workflow}/versions/{version}:
    get:
      summary: "Get a version (Accept: application/yaml returns YAML)"
      operationId: getWorkflowVersion
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/VersionId"
      responses:
        "200":
          description: The version with its canonical spec.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowVersion"
            application/yaml:
              schema: {type: string}
    put:
      summary: Replace a draft version's spec (409 VERSION_IMMUTABLE otherwise)
      operationId: updateWorkflowVersion
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/VersionId"
        - name: X-Expected-Version
          in: header
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/yaml:
            schema: {type: string}
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: Updated draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowVersion"
        "409":
          description: Version immutable, stale expected version, or DRAFT_LOCKED while a non-terminal test execution uses the draft.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/workflows/{workflow}/versions/{version}/layout:
    put:
      summary: Store editor layout (draft and published versions)
      operationId: updateWorkflowLayout
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/VersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "204":
          description: Stored.

  /tenants/{tenant}/workflows/{workflow}/versions/{version}/publish:
    post:
      summary: Publish a draft (workflow.publish; full validation + script gate)
      operationId: publishWorkflowVersion
      description: >
        Runs steps 1-8 plus a current valid ScriptValidation for every
        script-bearing task (missing/stale ones run the pipeline
        synchronously). On success the version becomes immutable and
        the workflow's latest_published_version_id is set atomically.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/VersionId"
      responses:
        "200":
          description: Published version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowVersion"
        "422":
          description: Validation or per-task script diagnostics failed.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: Version is not a draft.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/workflows/{workflow}/versions/{version}/deprecate:
    post:
      summary: Deprecate a published version (workflow.publish)
      operationId: deprecateWorkflowVersion
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/VersionId"
      responses:
        "204":
          description: Deprecated.
        "409":
          description: Version is not published.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/workflows/{workflow}/versions/{version}/validations:
    get:
      summary: ScriptValidations recorded against this version
      operationId: listWorkflowVersionValidations
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/VersionId"
      responses:
        "200":
          description: Validations, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  validations:
                    type: array
                    items:
                      type: object

  /tenants/{tenant}/workflows/{workflow}/versions/{version}/tasks/{task}/validate:
    post:
      summary: Run the validation pipeline on one task's script
      operationId: validateWorkflowTask
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/VersionId"
        - $ref: "#/components/parameters/TaskName"
      responses:
        "200":
          description: Validation result persisted for (version, task).
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: {type: boolean}
                  validationId: {type: string, format: uuid}
                  diagnostics:
                    type: array
                    items:
                      $ref: "#/components/schemas/Diagnostic"
                  toolVersions:
                    type: object
                    additionalProperties: {type: string}

  /tenants/{tenant}/workflows/{workflow}/versions/{version}/tasks/{task}/import-sbatch:
    post:
      summary: Convert legacy #SBATCH directives for one task (proposal only)
      operationId: importWorkflowTaskSbatch
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/VersionId"
        - $ref: "#/components/parameters/TaskName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportSbatchRequest"
      responses:
        "200":
          description: Import proposal; the draft is not modified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSbatchResponse"
        "403":
          description: Import disabled by effective policy.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/workflows/{workflow}/versions/{version}/tasks/{task}/preview-submission:
    post:
      summary: Read-only submission preview for one task (workflow.read)
      operationId: previewWorkflowTaskSubmission
      description: >
        Builds the frozen ExecutionSpec, wrapper script and neutral
        JobSubmission for the task (attempt=1, caller as principal).
        Persists nothing, submits nothing.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/VersionId"
        - $ref: "#/components/parameters/TaskName"
      responses:
        "200":
          description: Submission preview.
          content:
            application/json:
              schema:
                type: object
                properties:
                  executionSpec: {type: object}
                  wrapper: {type: string}
                  jobSubmission: {type: object}
        "422":
          description: Admission denied.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/workflows/{workflow}/versions/{version}/tasks/{task}/sbatch:
    get:
      summary: Export one workflow task as a portable sbatch script
      operationId: exportWorkflowTaskSbatch
      description: >
        Renders only fields representable in a standalone Slurm script.
        Account is intentionally omitted and must come from the destination site.
        Unsupported workflow references return 422 EXPORT_UNSUPPORTED.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/VersionId"
        - $ref: "#/components/parameters/TaskName"
      responses:
        "200":
          description: Portable sbatch script.
          headers:
            Content-Disposition:
              schema: {type: string}
              description: Attachment filename `<task>.sbatch`.
          content:
            text/x-shellscript:
              schema: {type: string}
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires workflow.read.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Workflow, version, task, or stored script not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "422":
          description: A task feature cannot be represented in standalone sbatch.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/workflow-executions:
    post:
      summary: Execute a workflow version (workflow.execute; Idempotency-Key required)
      operationId: executeWorkflow
      description: >
        Creates a PENDING WorkflowExecution pinned to the version's spec
        hash and enqueues the engine. Normal runs require a published version.
        Test runs set test=true, require an explicit draft version, and require
        both workflow.create and workflow.execute on the project. The
        idempotency key scopes replay to (tenant, key); a reused key with a
        different body is a 409.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/Idempotency-Key"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowExecuteRequest"
      responses:
        "202":
          description: Execution accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecution"
        "400":
          description: Missing/invalid Idempotency-Key or malformed body.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires workflow.execute, and workflow.create for test runs, on the project.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Workflow not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: Idempotency-Key reused with a different body, no published version, or draft changed before test creation.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "422":
          description: Test runs require a draft version; draft versions require test=true.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    get:
      summary: List workflow executions (execution.read.self|tenant)
      operationId: listWorkflowExecutions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: workflow
          in: query
          description: Workflow uuid filter.
          schema: {type: string, format: uuid}
        - name: state
          in: query
          description: Execution state filter.
          schema: {type: string}
        - name: test
          in: query
          description: Filter test runs (true) or normal runs (false); omitted returns both.
          schema: {type: boolean}
      responses:
        "200":
          description: Execution list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecutionList"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires execution.read.self.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "400":
          description: Invalid test filter.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/workflow-executions/{execution}:
    get:
      summary: Get a workflow execution (execution.read.self|project|tenant)
      operationId: getWorkflowExecution
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - name: execution
          in: path
          required: true
          description: Execution uuid.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The execution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecution"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires an execution.read.* permission.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Execution not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/workflow-executions/{execution}/cancel:
    post:
      summary: Cancel an execution (execution.cancel.self|any)
      operationId: cancelWorkflowExecution
      description: >
        Moves the execution to CANCELING; the engine enqueues
        job.cancel for active task jobs and cancels the rest.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - name: execution
          in: path
          required: true
          description: Execution uuid.
          schema: {type: string, format: uuid}
      responses:
        "202":
          description: Cancellation accepted.
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires an execution.cancel.* permission.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Execution not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: Execution is already terminal.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/workflow-executions/{execution}/tasks:
    get:
      summary: List task executions (execution.read.self|project|tenant)
      operationId: listTaskExecutions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - name: execution
          in: path
          required: true
          description: Execution uuid.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Task executions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskExecutionList"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Execution not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/workflow-executions/{execution}/tasks/{task}/execution-spec:
    get:
      summary: Get the task's frozen ExecutionSpec (execution.read.*)
      operationId: getTaskExecutionSpec
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - name: execution
          in: path
          required: true
          description: Execution uuid.
          schema: {type: string, format: uuid}
        - name: task
          in: path
          required: true
          description: Task execution uuid.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The frozen ExecutionSpec.
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Task execution or frozen spec not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/workflow-executions/{execution}/tasks/{task}/validation:
    get:
      summary: Get the task's recorded ScriptValidation (execution.read.*)
      operationId: getTaskExecutionValidation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - name: execution
          in: path
          required: true
          description: Execution uuid.
          schema: {type: string, format: uuid}
        - name: task
          in: path
          required: true
          description: Task execution uuid.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The recorded ScriptValidation.
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Task execution or validation not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/policies/validation:
    get:
      summary: Get the tenant validation policy (policy.read)
      operationId: getTenantValidationPolicy
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      responses:
        "200":
          description: Validation policy (defaults when unset, version 0).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationPolicyResponse"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Tenant not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    put:
      summary: Replace the tenant validation policy (policy.manage)
      operationId: setTenantValidationPolicy
      description: >
        Tenant policy may only be stricter than every assigned cluster's
        policy — a looser write is rejected 422 POLICY_NOT_STRICTER.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationPolicyRequest"
      responses:
        "200":
          description: Policy stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationPolicyResponse"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires policy.manage.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: Version conflict.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "422":
          description: Invalid policy or not stricter than a cluster policy.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /clusters/{cluster}/policies/validation:
    get:
      summary: Get the cluster validation policy (platform)
      operationId: getClusterValidationPolicy
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClusterRef"
      responses:
        "200":
          description: Validation policy (defaults when unset, version 0).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationPolicyResponse"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Cluster not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    put:
      summary: Replace the cluster validation policy (platform only)
      operationId: setClusterValidationPolicy
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ClusterRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationPolicyRequest"
      responses:
        "200":
          description: Policy stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationPolicyResponse"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires policy.manage at platform scope.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Cluster not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: Version conflict.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/jobs:
    get:
      summary: List jobs tenant-wide (job.read.tenant)
      operationId: listTenantJobs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: state
          in: query
          description: Comma-separated job states filter.
          schema: {type: string}
        - name: cluster
          in: query
          description: Cluster uuid filter.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Job list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires job.read.tenant.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/projects/{project}/jobs:
    get:
      summary: List project jobs (job.read.project or own jobs)
      operationId: listJobs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/ProjectRef"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: state
          in: query
          description: Comma-separated job states filter.
          schema: {type: string}
        - name: cluster
          in: query
          description: Cluster uuid filter.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Job list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Project not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    post:
      summary: Submit a job (job.submit; Idempotency-Key required)
      operationId: submitJob
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/ProjectRef"
        - $ref: "#/components/parameters/Idempotency-Key"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobSubmit"
      responses:
        "202":
          description: Job accepted for submission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "200":
          description: Idempotent replay of a previous submission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: Missing/invalid Idempotency-Key or malformed body.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "403":
          description: Requires job.submit.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Project not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: Idempotency-Key reused with a different body (IDEMPOTENCY_MISMATCH).
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "422":
          description: Script validation or admission denial.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorBody"

  /tenants/{tenant}/projects/{project}/jobs/{job}:
    get:
      summary: Get a job
      operationId: getJob
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/ProjectRef"
        - name: job
          in: path
          required: true
          description: Job uuid.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Job detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Job not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/projects/{project}/jobs/{job}/cancel:
    post:
      summary: Request job cancellation (202)
      operationId: cancelJob
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/ProjectRef"
        - name: job
          in: path
          required: true
          description: Job uuid.
          schema: {type: string, format: uuid}
      responses:
        "202":
          description: Cancellation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Job not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "409":
          description: Job is already terminal.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/projects/{project}/jobs/{job}/execution-spec:
    get:
      summary: Get the immutable admitted execution spec
      operationId: getJobExecutionSpec
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - $ref: "#/components/parameters/ProjectRef"
        - name: job
          in: path
          required: true
          description: Job uuid.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: The frozen ExecutionSpec.
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Unauthenticated.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
        "404":
          description: Job not found.
          content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}

  /tenants/{tenant}/projects/{project}/allocations:
    parameters:
      - $ref: "#/components/parameters/TenantSlug"
      - $ref: "#/components/parameters/ProjectRef"
    get:
      operationId: listAllocations
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Project allocations, content: {application/json: {schema: {$ref: "#/components/schemas/AllocationList"}}}}
        "401": {description: Unauthenticated, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: Requires allocation.read, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: Project not found, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    post:
      operationId: createAllocation
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateAllocation"}}}}
      responses: {"201": {description: Allocation created, content: {application/json: {schema: {$ref: "#/components/schemas/Allocation"}}}}, "422": {description: Invalid allocation}}

  /tenants/{tenant}/projects/{project}/allocations/{allocation}:
    parameters:
      - $ref: "#/components/parameters/TenantSlug"
      - $ref: "#/components/parameters/ProjectRef"
      - {name: allocation, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getAllocation
      security: [{bearerAuth: []}]
      responses: {"200": {description: Allocation, content: {application/json: {schema: {$ref: "#/components/schemas/Allocation"}}}}}
    patch:
      operationId: updateAllocation
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/UpdateAllocation"}}}}
      responses: {"200": {description: Updated allocation, content: {application/json: {schema: {$ref: "#/components/schemas/Allocation"}}}}, "409": {description: Version conflict}}
    delete:
      operationId: deleteAllocation
      security: [{bearerAuth: []}]
      responses: {"204": {description: Deleted}}

  /tenants/{tenant}/accounting/allocations:
    get:
      operationId: listAccountingAllocations
      security: [{bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/TenantSlug"}]
      responses:
        "200": {description: Visible allocations with consumption and remaining amounts, content: {application/json: {schema: {$ref: "#/components/schemas/AccountingAllocationList"}}}}
        "401": {description: Unauthenticated, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: Requires allocation.read, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: Tenant not found, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}

  /clusters/{cluster}/policy-sync:
    get:
      operationId: getPolicySync
      security: [{bearerAuth: []}]
      parameters: [{name: cluster, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: Policy reconciliation summary, content: {application/json: {schema: {$ref: "#/components/schemas/PolicySyncSummary"}}}}}
    post:
      operationId: triggerPolicySync
      security: [{bearerAuth: []}]
      parameters: [{name: cluster, in: path, required: true, schema: {type: string}}]
      responses: {"202": {description: Policy sync enqueued}}

  /clusters/{cluster}/policy-sync/plan:
    get:
      operationId: getPolicySyncPlan
      security: [{bearerAuth: []}]
      parameters: [{name: cluster, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: Current dry-run policy operations, content: {application/json: {schema: {$ref: "#/components/schemas/PolicySyncPlan"}}}}}

  /tenants/{tenant}/secret-connectors:
    parameters:
      - $ref: "#/components/parameters/TenantSlug"
    get:
      operationId: listSecretConnectors
      summary: List tenant secret connectors
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Connector list, content: {application/json: {schema: {$ref: "#/components/schemas/SecretConnectorList"}}}}
        "401": {description: Unauthenticated, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: Requires secret.connector.read, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: Tenant not found, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    post:
      operationId: createSecretConnector
      summary: Create a tenant secret connector
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateSecretConnector"}}}}
      responses:
        "201": {description: Connector created, content: {application/json: {schema: {$ref: "#/components/schemas/SecretConnector"}}}}
        "401": {description: Unauthenticated, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: Requires secret.connector.manage, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: Tenant not found, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "422": {description: Invalid connector configuration or unavailable provider, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}

  /tenants/{tenant}/secret-connectors/{connector}:
    parameters:
      - $ref: "#/components/parameters/TenantSlug"
      - {name: connector, in: path, required: true, schema: {type: string}}
    get:
      operationId: getSecretConnector
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Connector, content: {application/json: {schema: {$ref: "#/components/schemas/SecretConnector"}}}}
        "401": {description: Unauthenticated, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: Requires secret.connector.read, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: Connector not found, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    patch:
      operationId: updateSecretConnector
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/UpdateSecretConnector"}}}}
      responses:
        "200": {description: Connector updated, content: {application/json: {schema: {$ref: "#/components/schemas/SecretConnector"}}}}
        "401": {description: Unauthenticated, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: Requires secret.connector.manage, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: Connector not found, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: Version conflict or connector is immutable, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "422": {description: Invalid configuration or connector state, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    delete:
      operationId: deleteSecretConnector
      security: [{bearerAuth: []}]
      responses:
        "204": {description: Connector deleted}
        "401": {description: Unauthenticated, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: Requires secret.connector.manage, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: Connector not found, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: Connector is in use, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}

  /tenants/{tenant}/secret-connectors/{connector}/test:
    parameters:
      - $ref: "#/components/parameters/TenantSlug"
      - {name: connector, in: path, required: true, schema: {type: string}}
    post:
      operationId: testSecretConnector
      security: [{bearerAuth: []}]
      responses: {"200": {description: Connectivity result, content: {application/json: {schema: {type: object}}}}}

  /tenants/{tenant}/secret-references:
    parameters:
      - $ref: "#/components/parameters/TenantSlug"
    get:
      operationId: listSecretReferences
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Reference list, content: {application/json: {schema: {$ref: "#/components/schemas/SecretReferenceList"}}}}
        "401": {description: Unauthenticated, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: Requires secret.reference.read, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: Tenant not found, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    post:
      operationId: createSecretReference
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateSecretReference"}}}}
      responses: {"201": {description: Reference created, content: {application/json: {schema: {$ref: "#/components/schemas/SecretReference"}}}}, "422": {description: Invalid reference}}

  /tenants/{tenant}/secret-references/{reference}:
    parameters:
      - $ref: "#/components/parameters/TenantSlug"
      - {name: reference, in: path, required: true, schema: {type: string}}
    get:
      operationId: getSecretReference
      security: [{bearerAuth: []}]
      responses: {"200": {description: Reference, content: {application/json: {schema: {$ref: "#/components/schemas/SecretReference"}}}}}
    patch:
      operationId: updateSecretReference
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allowed_uses:
                  type: array
                  items: {type: string, enum: [workflow_env, wrapped_token, image_pull]}
      responses: {"200": {description: Reference updated, content: {application/json: {schema: {$ref: "#/components/schemas/SecretReference"}}}}}
    delete:
      operationId: deleteSecretReference
      security: [{bearerAuth: []}]
      responses: {"204": {description: Reference deleted}}

  /tenants/{tenant}/secret-references/{reference}/test:
    parameters:
      - $ref: "#/components/parameters/TenantSlug"
      - {name: reference, in: path, required: true, schema: {type: string}}
    post:
      operationId: testSecretReference
      security: [{bearerAuth: []}]
      responses: {"200": {description: Resolution result without a value, content: {application/json: {schema: {type: object}}}}}

  /tenants/{tenant}/accounting/usage:
    get:
      operationId: getAccountingUsage
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - {name: group_by, in: query, required: true, schema: {type: string, enum: [user, project, cluster, account, partition, day]}}
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: project, in: query, schema: {type: string, format: uuid}}
        - {name: cluster, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        "200": {description: Bounded accounting usage page, content: {application/json: {schema: {$ref: "#/components/schemas/AccountingUsageList"}}}}
        "400": {description: Invalid or greater-than-400-day range, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}

  /tenants/{tenant}/accounting/top:
    get:
      operationId: getAccountingTop
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
        - {name: metric, in: query, required: true, schema: {type: string, enum: [cpu_seconds, gpu_seconds, jobs]}}
        - {name: by, in: query, required: true, schema: {type: string, enum: [user, project]}}
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50}}
      responses:
        "200": {description: Top consumers, content: {application/json: {schema: {$ref: "#/components/schemas/AccountingTopList"}}}}
        "400": {description: Invalid range, metric, or grouping, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "401": {description: Unauthenticated, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: Requires accounting.read.self, accounting.read.project, or accounting.read.tenant, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: Tenant not found, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}

  /clusters/{cluster}/accounting:
    parameters: [{name: cluster, in: path, required: true, schema: {type: string}}]
    get:
      operationId: getClusterAccounting
      security: [{bearerAuth: []}]
      responses: {"200": {description: Collector status, content: {application/json: {schema: {type: object}}}}}

  /clusters/{cluster}/accounting/collect:
    parameters: [{name: cluster, in: path, required: true, schema: {type: string}}]
    post:
      operationId: collectClusterAccounting
      security: [{bearerAuth: []}]
      responses: {"202": {description: Collection enqueued}}

  /clusters/{cluster}/accounting/aggregate:
    parameters: [{name: cluster, in: path, required: true, schema: {type: string}}]
    post:
      operationId: aggregateClusterAccounting
      security: [{bearerAuth: []}]
      responses: {"202": {description: Aggregation enqueued}}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    nodeToken:
      type: http
      scheme: bearer
      description: Node pull token (cnt_...) used by custos-node-sync on compute nodes.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
            message:
              type: string
            request_id:
              type: string
            details:
              type: array
              items:
                type: object
                required: [field, reason]
                properties:
                  field:
                    type: string
                  reason:
                    type: string

    ListEnvelope:
      type: object
      description: |
        Generic list envelope template. Concrete list responses use
        `{items: [...], next_cursor: string|null}`; `total` may be added
        only where the count is cheap (never for jobs/usage).
      required: [items]
      properties:
        items:
          type: array
          items: {}
        next_cursor:
          type: string
          nullable: true
          description: Opaque base64url keyset cursor; strictly validated, re-authorized per page.

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    CheckResult:
      type: object
      required: [name, status, latency_ms]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [ok, fail]
        latency_ms:
          type: integer

    Principal:
      type: object
      required: [issuer, subject, kind]
      properties:
        issuer:
          type: string
        subject:
          type: string
        kind:
          type: string
          enum: [user, service]
        email:
          type: string
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string

    MembershipRef:
      type: object
      required: [tenant_id, slug, name, roles]
      properties:
        tenant_id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            type: string

    Me:
      type: object
      required: [principal, user_id, platform_roles, memberships]
      properties:
        principal:
          $ref: "#/components/schemas/Principal"
        user_id:
          type: string
          format: uuid
        platform_roles:
          type: array
          items:
            type: string
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/MembershipRef"
        project_memberships:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMembershipRef"

    Project:
      type: object
      required: [id, slug, name, description, state, settings, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        state:
          type: string
          enum: [active, archived]
        settings:
          type: object
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        next_cursor:
          type: string
          nullable: true

    ProjectCreate:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        settings:
          type: object

    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        settings:
          type: object
        version:
          type: integer

    ProjectMembership:
      type: object
      required: [project_id, user_id, roles, source, created_at, updated_at]
      properties:
        project_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
            enum: [project-admin, project-member, project-viewer]
        source:
          type: string
          enum: [manual, idp]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectMembershipList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMembership"
        next_cursor:
          type: string
          nullable: true

    ProjectMembershipRef:
      type: object
      required: [project_id, slug, tenant_id, roles]
      properties:
        project_id:
          type: string
          format: uuid
        slug:
          type: string
        tenant_id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string

    ProjectMemberUpsert:
      type: object
      required: [user_id, roles]
      properties:
        user_id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
            enum: [project-admin, project-member, project-viewer]

    ProjectMemberUpdate:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items:
            type: string
            enum: [project-admin, project-member, project-viewer]

    ClusterBinding:
      type: object
      required: [id, project_id, cluster_id, slurm_account, default_partition,
        allowed_partitions, default_qos, allowed_qos, enabled, version,
        created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        cluster_id:
          type: string
          format: uuid
        slurm_account:
          type: string
        default_partition:
          type: string
        allowed_partitions:
          type: array
          items:
            type: string
        default_qos:
          type: string
        allowed_qos:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        drift:
          type: array
          items:
            type: object
            required: [code, detail]
            properties:
              code: {type: string}
              detail: {type: string}
        drift_checked_at: {type: [string, "null"], format: date-time}
        drift_state: {type: string, enum: [ok, drift, unknown, error]}

    ClusterBindingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClusterBinding"

    ClusterBindingUpsert:
      type: object
      required: [cluster_id, slurm_account]
      properties:
        cluster_id:
          type: string
          format: uuid
        slurm_account:
          type: string
        default_partition:
          type: string
        allowed_partitions:
          type: array
          items:
            type: string
        default_qos:
          type: string
        allowed_qos:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        version:
          type: integer

    ResourcePolicyRequest:
      type: object
      required: [policy]
      properties:
        policy:
          type: object
          description: admission.ResourcePolicy JSON shape (see docs/script-validation.md).
        version:
          type: integer

    ResourcePolicyResponse:
      type: object
      required: [policy, version]
      properties:
        policy:
          type: object
        version:
          type: integer
        effective:
          type: object
          description: Project-scope GETs also return the tenant ∩ project effective policy.

    Tenant:
      type: object
      required: [id, slug, name, state, settings, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        state:
          type: string
          enum: [provisioning, active, suspended, deleting, deleted]
        settings:
          type: object
        openbao_namespace:
          type: string
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TenantCreate:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
        name:
          type: string
          minLength: 1
        settings:
          type: object

    TenantUpdate:
      type: object
      required: [version]
      properties:
        name:
          type: string
        settings:
          type: object
        state:
          type: string
          enum: [active, suspended]
        version:
          type: integer

    TenantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tenant"
        next_cursor:
          type: string
          nullable: true

    Membership:
      type: object
      required: [tenant_id, user_id, roles, source, created_at, updated_at]
      properties:
        tenant_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
        source:
          type: string
          enum: [manual, idp]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MemberAdd:
      type: object
      required: [user_id, roles]
      properties:
        user_id:
          type: string
          format: uuid
        roles:
          type: array
          minItems: 1
          items:
            type: string
            enum: [tenant-admin, tenant-operator, workflow-author, researcher, viewer, auditor]

    MemberUpdate:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          items:
            type: string
            enum: [tenant-admin, tenant-operator, workflow-author, researcher, viewer, auditor]

    MembershipList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
        next_cursor:
          type: string
          nullable: true

    ReadyStatus:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/CheckResult"

    Group:
      type: object
      required: [id, tenant_id, name, description, source, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        source:
          type: string
          enum: [manual, idp]
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GroupCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9 ._-]{0,62}$"
        description:
          type: string

    GroupUpdate:
      type: object
      required: [version]
      properties:
        name:
          type: string
        description:
          type: string
        version:
          type: integer

    GroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Group"
        next_cursor:
          type: string
          nullable: true

    GroupMembership:
      type: object
      required: [group_id, user_id, source, created_at]
      properties:
        group_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        source:
          type: string
          enum: [manual, idp]
        created_at:
          type: string
          format: date-time

    GroupMemberAdd:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid

    GroupMemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GroupMembership"
        next_cursor:
          type: string
          nullable: true

    ClaimRule:
      type: object
      required: [id, tenant_id, claim, match_value, roles, enabled, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        claim:
          type: string
        match_value:
          type: string
        roles:
          type: array
          items:
            type: string
        group_id:
          type: string
          format: uuid
          nullable: true
        enabled:
          type: boolean
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ClaimRuleCreate:
      type: object
      required: [claim, match_value, roles]
      properties:
        claim:
          type: string
          pattern: "^[a-zA-Z_][a-zA-Z0-9_.:/-]{0,127}$"
        match_value:
          type: string
          minLength: 1
          maxLength: 512
        roles:
          type: array
          minItems: 1
          items:
            type: string
            enum: [tenant-admin, tenant-operator, workflow-author, researcher, viewer, auditor]
        group_id:
          type: string
          format: uuid
        enabled:
          type: boolean

    ClaimRuleUpdate:
      type: object
      required: [version]
      properties:
        roles:
          type: array
          minItems: 1
          items:
            type: string
            enum: [tenant-admin, tenant-operator, workflow-author, researcher, viewer, auditor]
        group_id:
          type: string
          format: uuid
          nullable: true
        enabled:
          type: boolean
        version:
          type: integer

    ClaimRuleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClaimRule"
        next_cursor:
          type: string
          nullable: true

    PlatformRoleBinding:
      type: object
      required: [user_id, issuer, subject, role, created_at]
      properties:
        user_id:
          type: string
          format: uuid
        issuer:
          type: string
        subject:
          type: string
